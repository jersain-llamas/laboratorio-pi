<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio 01 · Estrategia de marca</title>
<meta name="description" content="Simulación profesional de estrategia marcaria en México: del lanzamiento comercial a una estrategia de protección defendible.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f2ed;--surface:#ffffff;--paper:#fffdf8;--ink:#1b2430;--ink2:#38414d;--muted:#5d6572;--line:#d6d0c4;--line2:#e8e3d9;--accent:#21495a;--accent2:#2c6175;--accent-soft:#e6edef;--warm:#7a4a1d;--warm-soft:#f6ede0;--err:#8a2a2a;--err-soft:#f8eaea;--focus:#1b6aa1;--r:6px;--hh:64px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:16px;line-height:1.55}
a{color:var(--accent2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{line-height:1.25;color:var(--ink)}
/* Header */
.topbar{position:sticky;top:0;z-index:40;background:#17252d;color:#eef0ec;height:var(--hh);display:flex;align-items:center;gap:16px;padding:0 20px}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:0 0 auto}
.brand .k{font-size:11px;letter-spacing:.18em;color:#a7b4b9}
.brand .t{font-size:15px;font-weight:600;letter-spacing:.07em}
.phaseinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding-left:16px;border-left:1px solid #33454e}
.phaseinfo .n{font-size:12px;color:#a7b4b9;letter-spacing:.04em}
.phaseinfo .p{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#2a3b44}
.progress i{display:block;height:100%;background:#b8955a;width:0;transition:width .3s}
.expbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #4a5d66;border-radius:var(--r);background:transparent;color:#eef0ec;cursor:pointer}
.expbtn .badge{background:#b8955a;color:#17252d;border-radius:10px;font-size:12px;font-weight:700;padding:1px 7px}
/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;max-width:1360px;margin:0 auto}
main{padding:28px 36px 0;min-width:0}
.wrap{max-width:860px;margin:0 auto}
aside#exp{border-left:1px solid var(--line);background:#efece5;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow:auto;padding:20px 18px 40px}
.scrim{display:none}
@media (min-width:1024px){.expbtn{display:none}}
@media (max-width:1023px){
 .layout{grid-template-columns:1fr}
 aside#exp{position:fixed;top:0;right:0;bottom:0;height:100%;width:min(92vw,400px);transform:translateX(105%);transition:transform .22s ease;z-index:60;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
 body.exp-open aside#exp{transform:none}
 body.exp-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,22,28,.45);z-index:55}
 main{padding:20px 18px 0}
}
@media (max-width:640px){.brand .k{display:none}.brand .t{font-size:13px}.phaseinfo{padding-left:10px}.topbar{padding:0 12px;gap:10px}.expbtn .lbl{display:none}}
/* Expediente */
.exp-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}
.exp-h h2{font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--ink2)}
.exp-close{display:none;min-height:40px;min-width:40px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer}
@media (max-width:1023px){.exp-close{display:inline-block}}
.exp-note{font-size:13px;color:var(--muted);margin:0 0 14px}
.exp-list{list-style:none;margin:0;padding:0}
.exp-list li{margin:0 0 6px}
.exp-item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:9px 12px;cursor:pointer;min-height:44px}
.exp-item:hover{border-color:var(--line)}
.exp-item .w{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.exp-item .ti{display:block;font-size:14.5px;line-height:1.35}
.exp-item .nw{float:right;font-size:11px;font-weight:700;color:var(--warm);letter-spacing:.05em;text-transform:uppercase}
.exp-empty{font-size:14px;color:var(--muted)}
/* Phase */
.eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.ph-title{font-size:28px;margin:4px 0 6px;font-weight:650}
.ph-lead{color:var(--ink2);margin:0 0 18px;max-width:72ch}
.screen{border-left:3px solid var(--accent);background:var(--surface);padding:14px 18px;margin:16px 0;color:var(--ink2)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:18px 0}
.block>h3{font-size:17.5px;margin:0 0 2px}
.block .code{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
.block .q{margin:6px 0 12px;color:var(--ink2)}
.sub{font-size:14px;color:var(--muted)}
.part{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:30px 0 0;border-top:1px solid var(--line);padding-top:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line2);border-radius:var(--r);margin:7px 0;background:#fff;cursor:pointer;min-height:44px}
.opt input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.dis{cursor:default;opacity:.85}
.opt .ot b{font-weight:600}
.opt .od{display:block;font-size:14px;color:var(--muted)}
.inline-opts{display:flex;flex-wrap:wrap;gap:6px}
.inline-opts .opt{margin:0;flex:1 1 180px}
select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:8px 10px}
select:disabled{background:#f2f0eb;color:var(--muted)}
.ta,.inp{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;line-height:1.5}
.ta{min-height:96px;resize:vertical}
.ta.long{min-height:170px}
.ta:disabled,.inp:disabled{background:#f6f4ef;color:var(--ink2)}
.fl{display:block;font-weight:600;margin:14px 0 6px}
.cnt{font-size:13px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.cnt.short{color:var(--warm)}
.grid-el{display:grid;grid-template-columns:1.25fr 1.35fr 1fr;gap:10px 14px;align-items:start;padding:14px 0;border-top:1px solid var(--line2)}
.grid-el:first-of-type{border-top:0}
.grid-el .nm b{display:block}
.grid-el .nm span{font-size:13.5px;color:var(--muted)}
.grid-el label.mini{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
@media (max-width:760px){.grid-el{grid-template-columns:1fr}}
.linegrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:8px 16px;padding:12px 0;border-top:1px solid var(--line2);align-items:center}
@media (max-width:760px){.linegrid{grid-template-columns:1fr}}
.linegrid .inline-opts .opt{flex:1 1 120px;font-size:14px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:#fff;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip input{accent-color:var(--accent);width:16px;height:16px}
.cls-row{border-top:1px solid var(--line2);padding:10px 0}
.cls-cover{margin:6px 0 4px 30px}
.budget{border:1px solid var(--line);background:#faf8f3;border-radius:var(--r);padding:14px 16px;margin:16px 0}
.budget .bh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.slots{display:flex;gap:6px;margin:10px 0 6px}
.slot{flex:1;height:10px;border-radius:2px;background:#e3ded3}
.slot.f{background:var(--accent)}
.slot.x{background:var(--warm)}
.blist{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.blist li{padding:6px 0;border-top:1px dashed var(--line)}
.olist{list-style:none;margin:10px 0;padding:0;counter-reset:o}
.olist li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;margin:6px 0}
.olist li .rk{font-weight:700;color:var(--accent);min-width:22px}
.olist li .lb{flex:1}
.olist li button{min-height:40px;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-size:13.5px}
.olist li button:disabled{opacity:.35;cursor:default}
.divider{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;padding-top:8px;border-top:1px solid var(--line)}
.divider.s4{color:var(--accent);border-top:0}
.ant{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:18px 0;overflow:hidden}
.ant-h{background:#f2efe8;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ant-h b{font-size:17px;letter-spacing:.03em}
.ant-h span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ant-b{padding:12px 16px}
.mx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 16px;border-top:1px solid var(--line2);background:#fbfaf6}
.mx label{font-size:12px;letter-spacing:.04em;color:var(--muted);display:block;margin-bottom:3px}
@media (max-width:860px){.mx{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.mx{grid-template-columns:1fr}}
.mx-aff{padding:0 16px 14px;background:#fbfaf6}
.newdocs{border:1px solid #d9c9ad;background:var(--warm-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0}
.newdocs b{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm)}
.newdocs ul{margin:6px 0 0;padding-left:18px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent2);text-decoration:underline;cursor:pointer;text-align:left;min-height:32px}
.errors{border-left:4px solid var(--err);background:var(--err-soft);padding:12px 16px;margin:18px 0;border-radius:0 var(--r) var(--r) 0}
.errors b{color:var(--err)}
.errors ul{margin:6px 0 0;padding-left:20px}
.notice{border-left:3px solid var(--warm);background:var(--warm-soft);padding:10px 14px;margin:12px 0;font-size:15px}
.ro-note{font-size:14px;color:var(--muted);background:#ece9e2;border-radius:var(--r);padding:8px 12px;margin:10px 0}
.navbar{position:sticky;bottom:0;z-index:20;background:rgba(244,242,237,.97);border-top:1px solid var(--line);margin:36px -36px 0;padding:12px 36px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:1023px){.navbar{margin:28px -18px 0;padding:10px 18px}}
.btn{min-height:46px;padding:0 20px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
.btn:hover{background:var(--accent2)}
.btn.sec{background:#fff;color:var(--accent)}
.btn.sec:hover{background:var(--accent-soft)}
.btn.warn{background:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Portada */
.cover{max-width:720px;margin:6vh auto 40px;background:var(--paper);border:1px solid var(--line);padding:44px 44px 36px;border-radius:4px}
.cover .lab{font-size:13px;letter-spacing:.24em;color:var(--muted)}
.cover h1{font-size:34px;letter-spacing:.06em;margin:6px 0 4px;font-weight:700}
.cover .subt{font-size:18px;color:var(--ink2);margin:0 0 22px;font-style:italic}
.cover p{color:var(--ink2)}
.cover .priv{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}
.cover .fict{font-size:14px;background:#f2efe8;padding:10px 14px;border-radius:var(--r)}
@media (max-width:640px){.cover{padding:26px 20px;margin:16px auto}.cover h1{font-size:26px}}
/* Documents */
.doc{background:var(--paper);border:1px solid var(--line);padding:26px 30px;font-size:15px;line-height:1.6;color:var(--ink)}
.doc+.doc{margin-top:14px}
@media (max-width:640px){.doc{padding:18px 16px}}
.sim{display:inline-block;border:1px solid #9b8f78;color:#5b4f3a;letter-spacing:.1em;font-size:11.5px;font-weight:600;text-transform:uppercase;padding:5px 10px;margin:0 0 14px}
.sim2{display:block;font-size:12.5px;color:#5b4f3a;margin:-8px 0 14px}
.doc h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.doc h3{font-size:19px;margin:0 0 14px}
.doc p{margin:0 0 10px}
.mailh{border-bottom:1px solid var(--line2);padding-bottom:10px;margin-bottom:14px;font-size:14px}
.mailh div{display:grid;grid-template-columns:70px 1fr;gap:8px}
.mailh span{color:var(--muted)}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line2);margin-top:16px;padding-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
.tbl th,.tbl td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:#f6f3ec}
.tblwrap{overflow-x:auto}
.kv{display:grid;grid-template-columns:190px 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (max-width:640px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
.official{border-top:4px double #7d7462}
.letter-sign{margin-top:14px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,22,28,.58);display:none;z-index:90;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal.open{display:flex}
.modal-card{background:var(--bg);max-width:900px;width:100%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff;border-radius:6px 6px 0 0;position:sticky;top:0}
.modal-h h2{font-size:17px;margin:0}
.modal-h .w{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.modal-b{padding:18px}
.modal-x{min-height:44px;min-width:44px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-size:15px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17252d;color:#fff;padding:10px 16px;border-radius:var(--r);font-size:14.5px;z-index:95;display:none;max-width:90vw}
.toast.on{display:block}
/* Feedback */
.fbsec{margin:28px 0}
.fbsec>h2{font-size:21px;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.dim{display:grid;grid-template-columns:170px 230px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
@media (max-width:760px){.dim{grid-template-columns:1fr}}
.lv{display:flex;gap:4px}
.lv i{flex:1;height:12px;background:#e3ded3;border-radius:2px}
.lv i.f{background:var(--accent)}
.lvw{font-size:13px;color:var(--muted);margin-top:3px}
.dim .rd{font-size:14.5px;color:var(--ink2)}
.closest{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;margin:12px 0}
.al{border-left:3px solid var(--warm);background:var(--warm-soft);padding:10px 14px;margin:8px 0}
.al b{color:var(--warm)}
.cm{margin:8px 0}
.sc label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.sc input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.quote{white-space:pre-wrap;background:#fff;border:1px solid var(--line2);padding:12px 14px;border-radius:var(--r);font-size:15px}
/* Report */
.report{background:#fff;border:1px solid var(--line);padding:34px 40px}
@media (max-width:640px){.report{padding:20px 16px}}
.report h1{font-size:24px;margin:0 0 2px;letter-spacing:.04em}
.report h2{font-size:17px;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.report h3{font-size:15px;margin:14px 0 6px}
.report .meta{font-size:14px;color:var(--ink2)}
.report .rep-text{white-space:pre-wrap;background:#faf8f3;border:1px solid var(--line2);padding:10px 12px;border-radius:4px;font-size:14.5px}
.report .tbl{font-size:13.5px}
.rep-block{break-inside:avoid;page-break-inside:avoid}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--ink2);background:#f6f3ec}
@media print{
 @page{size:letter;margin:16mm 15mm}
 body{background:#fff;font-size:10.5pt;color:#000}
 .topbar,aside#exp,.navbar,.no-print,.modal,.scrim,.toast{display:none!important}
 .layout{display:block;max-width:none}
 main{padding:0}
 .wrap{max-width:none}
 .report{border:0;padding:0}
 .report h2{break-after:avoid;page-break-after:avoid}
 .report .rep-text{background:#fff;border:1px solid #bbb;break-inside:auto}
 .rep-block{break-inside:auto;page-break-inside:auto}
 .tbl tr{break-inside:avoid;page-break-inside:avoid}
 .tbl th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .lv i.f{background:#333!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 a{color:#000;text-decoration:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="topbar" id="topbar">
 <div class="brand"><span class="k">LABORATORIO 01</span><span class="t">ESTRATEGIA DE MARCA</span></div>
 <div class="phaseinfo" aria-live="polite"><span class="n" id="hdrN"></span><span class="p" id="hdrP"></span></div>
 <button type="button" class="expbtn" id="expBtn" data-act="toggle-exp" aria-controls="exp" aria-expanded="false"><span class="lbl">Expediente</span><span class="badge" id="expBadge" hidden></span><span class="sr">Abrir expediente</span></button>
 <div class="progress" aria-hidden="true"><i id="prog"></i></div>
</header>
<div class="layout">
 <main id="main" tabindex="-1"></main>
 <aside id="exp" aria-label="Expediente"></aside>
</div>
<div class="scrim" data-act="toggle-exp"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="modal-h"><div><div class="w" id="modalWhen"></div><h2 id="modalTitle"></h2></div><button type="button" class="modal-x" data-act="close-modal" aria-label="Cerrar">Cerrar</button></div><div class="modal-b" id="modalBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var KEY='labpi_estrategia_marca_v1';
var DIMS=['EXP','COS','VEL','AMP','REV','EVI'];
var DIM_NAMES={EXP:'Exposición jurídica',COS:'Costo',VEL:'Velocidad',AMP:'Amplitud de protección',REV:'Reversibilidad',EVI:'Calidad de la evidencia'};
var LEVELS=['muy bajo','bajo','medio','alto','muy alto'];
var PH_TITLES=['Apertura del expediente','Qué se quiere proteger','Delimitar productos y servicios','Clasificación de Niza','Búsqueda de antecedentes','Decisión estratégica','Evento procesal','Cierre del expediente'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function paras(s){return String(s||'').split(/\n{2,}/).map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';}).join('');}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
function pe(s){var o={};String(s||'').trim().split(/\s+/).filter(Boolean).forEach(function(t){var m=t.match(/^([A-Z]{3})([+-]\d)$/);if(m)o[m[1]]=(o[m[1]]||0)+parseInt(m[2],10);});return o;}

/* Solicitudes efectivamente presentadas.

   2) Excluye pendientes no confirmadas y nominativas retiradas en 5.3.
   3) Si SIGNO_FINAL = MIX y SIGNO_INICIAL ≠ MIX (estrategia E5), regla de consolidación:

        la de semana más favorable (4 antes que 7) y, si empatan, la de mayor prioridad (posición en el orden de la Fase 3);

function presented(){var prop=S.f3.prop||[],f5=S.f5,sigI=S.f1.signo,sigF=signoFinal(),has30=S.f3.classes.indexOf(30)>=0,out=[];
 prop.forEach(function(it,idx){if(it.kind==='M'&&!has30)return;var week=it.week;if(week==='P'){if(f5.pendDec[it.id]!=='confirmar')return;week=7;}if(it.kind==='D'&&f5.keep[it.id]==='retirar')return;var o=JSON.parse(JSON.stringify(it));o.week=week;o.prio=idx;out.push(o);});
 if(sigF==='MIX'&&sigI!=='MIX'){var groups={},drop=[];
  out.forEach(function(o){if(o.kind==='K')return;(groups[o.cls]=groups[o.cls]||[]).push(o);});
  Object.keys(groups).forEach(function(c){var g=groups[c].slice().sort(function(a,b){return (a.week-b.week)||(a.prio-b.prio);});if(g.length>1){g[0].consolidated=g.map(function(x){return x.id;});g[0].consolidatedWeeks=g.map(function(x){return x.week;});g.slice(1).forEach(function(x){drop.push(x);});}});
  out=out.filter(function(o){return drop.indexOf(o)<0;});
  out.forEach(function(o){if(o.kind==='K')return;if(!o.mixed)o.changed=true;o.mixed=true;o.label='XOKANA y diseño · marca mixta · clase '+o.cls;});}

 return Object.keys(plan).map(function(k){return plan[k];});}
function commDoc(folio){var p=commPlan().filter(function(x){return x.app.folio===folio;})[0];if(!p)return '<div class="doc">Comunicación no disponible.</div>';var o=p.app;var h='<div class="doc official">'+SIMI+'<h4>Instituto Mexicano de la Propiedad Industrial · Comunicación simulada</h4><h3>Resultado del examen de fondo</h3><dl class="kv"><dt>Solicitud</dt><dd>'+esc(o.folio)+' (folio simulado)</dd><dt>Signo</dt><dd>'+(o.mixed?'XOKANA y diseño (mixta)':'XOKANA (nominativa)')+'</dd><dt>Clase</dt><dd>'+o.cls+'</dd><dt>Productos o servicios</dt><dd>'+esc(descFor(o))+'</dd></dl><hr style="border:0;border-top:1px solid var(--line2);margin:14px 0">';
 p.mods.forEach(function(md){
  if(md.k==='M1'&&md.x==='A')h+=P('Del examen se advierte que la denominación solicitada es semejante en grado de confusión con la marca SOCANA, registrada con anterioridad para aguas minerales y gaseosas, bebidas a base de frutas, bebidas isotónicas, bebidas energéticas y preparaciones para elaborar bebidas. Los signos coinciden en su estructura y, en una de sus lecturas posibles, en su pronunciación. Los productos solicitados, entre ellos '+esc(m1Terms(o))+', son idénticos o estrechamente relacionados con los amparados por el registro citado.');
  if(md.k==='M1'&&md.x==='B')h+=P('Del examen se advierte que la denominación solicitada es semejante en grado de confusión con la marca SOCANA, registrada con anterioridad para diversas bebidas sin alcohol y preparaciones para elaborarlas. Aunque los productos solicitados pertenecen a otra clase, se considera que comparten con aquéllos su naturaleza de bebidas, su finalidad de consumo y sus canales de comercialización.');
  if(md.k==='M2')h+=P('El elemento figurativo de la marca mixta solicitada, dos mazorcas de cacao cruzadas en forma de X dentro de un círculo, es semejante al diseño de la marca MAZÁNTICA y diseño, registrada para productos idénticos.');
  if(md.k==='M3')h+=P('La solicitud encuentra como antecedente la solicitud XOKAN, presentada con anterioridad para servicios de cafetería y restaurante y aún en trámite. La resolución de la presente podría quedar en espera de lo que se resuelva sobre aquélla.');
  if(md.k==='M4')h+=P('La descripción contiene términos que no corresponden a la clase solicitada o que no permiten identificar con precisión los productos: '+esc(m4Terms())+'. Deberán aclararse, limitarse o suprimirse.');
  if(md.k==='M5')h+=P('Se tuvo en cuenta la oposición presentada por Embotelladora Sierra Azul, S.A. de C.V., en la etapa posterior a la publicación, de la que se dio conocimiento al solicitante en su oportunidad. Sus argumentos coinciden en lo sustancial con la anterioridad citada.');});
 h+=P('Se otorga al solicitante un plazo para manifestar lo que a su derecho convenga. <b>Plazo simulado para el ejercicio: cuatro semanas.</b>');
 return h+FOOT+'</div>';}
function seguimientoDoc(){var pj=projection(),m=modules(),r=S.f6.routes,cp=clsPres(),t='';
 if(pj.lvl==='favorable')t='Con la ruta elegida, la solicitud principal tiene una perspectiva razonable de continuar y el cliente conserva su fecha de presentación.';
 else if(pj.lvl.indexOf('favorable condicionada')===0){t='La perspectiva es buena, pero depende de '+(pj.dep||'la valoración de la autoridad')+'. El registro tomará más tiempo del previsto.';if(pj.lvl.indexOf('margen')>0)t+=' La investigación se encargó dentro del plazo de respuesta; queda poco margen para preparar la acción.';}
 else if(pj.lvl==='incierta')t='La respuesta descansa en argumentos que la autoridad podría no compartir y no hay una ruta alterna preparada.';
 else t='Es probable que la solicitud en la clase '+((m.M1==='A'&&cp.indexOf(32)>=0&&m1set().indexOf('R5')<0)?'32':'30')+' no prospere en estos términos.';
 var extra=[];
 if(m1set().indexOf('R3')>=0&&!consentDisp())extra.push('El acercamiento con el titular de SOCANA quedó iniciado, pero el documento no llegaría dentro del plazo simulado.');
 if(m.M2&&r.M2&&r.M2.p==='ARG')extra.push('El logotipo seguirá expuesto a la objeción por su semejanza con MAZÁNTICA y diseño.');
 if(m.M3&&r.M3&&r.M3.p==='ESP')extra.push('La clase 43 quedará supeditada a la solicitud XOKAN; la barra podría necesitar otra denominación.');
 if(m.M4&&r.M4&&r.M4.p==='SOS')extra.push('La descripción imprecisa sigue sin resolverse y retrasa el examen.');
 if(m.M5)extra.push('El titular de SOCANA sigue activo en el procedimiento; cualquier negociación partirá de una posición más tensa.');
 if(!detectoEncargo()&&S.f5.acts.indexOf('DOCUMENTAR_LOGO')<0)extra.push('La titularidad del logotipo sigue apoyándose en mensajes y en una cotización ambigua; el fondo la mantiene como pendiente de su revisión.');
 if(presented().some(function(o){return o.el==='SLOGAN'&&o.fig==='AVISO';}))extra.push('La solicitud de aviso comercial sigue su propio examen; su distintividad como frase completa será el punto a vigilar.');
 return memo('Sofía Arellano, socia responsable','Seguimiento — respuesta al examen de fondo','<div class="sim2" style="margin:0 0 10px">Proyección simulada para fines de entrenamiento: no anticipa cómo resolvería una autoridad real.</div>'+P(esc(t))+extra.map(function(x){return P(esc(x));}).join(''));}
function cronoDoc(){var c=buildChrono().filter(function(x){return x.ord>=3.2;});return '<div class="doc">'+SIMB+'<h4>Expediente XOKANA</h4><h3>Cronología del procedimiento</h3>'+tbl(['Momento simulado','Hito'],c.map(function(x){return [esc(x.cuando),esc(x.hito)];}))+FOOT+'</div>';}

 if(S.f1.signo!==signoFinal())h+='<div class="notice">La estrategia de presentación se modificó en la Fase 5: '+esc(SIGNO_SHORT[S.f1.signo])+' → '+esc(SIGNO_SHORT[signoFinal()])+'.'+consolidations().map(function(o){return '<br>Consolidación: '+esc(consolidationText(o));}).join('')+'</div>';
 h+=tbl(['Folio simulado','Momento','Signo y figura','Clase','Descripción'],pres.map(function(o){return [esc(o.folio),'Semana '+o.week,esc(o.label),o.kind==='K'?'—':String(o.cls),esc(descFor(o))];}));
 var disc=(S.f3.prop||[]).filter(function(o){return o.week==='P'&&S.f5.pendDec[o.id]==='descartar';});if(disc.length)h+=P('Pendientes descartados: '+esc(disc.map(function(o){return o.label;}).join('; '))+'.');
 return h+FOOT+'</div>';}

var DOCS={
 asignacion:{t:'Nota de asignación',w:'Semana 1',o:1,r:function(){return memo('Sofía Arellano, socia responsable','Nuevo asunto — Orígenes Fermentados / XOKANA',P('Te asigno este asunto. El cliente lanza en 20 semanas una bebida de cacao fermentado y quiere “proteger todo”. Además, el fondo que encabeza su ronda quiere ver una estrategia de protección marcaria antes del cierre, en la semana 12.')+P('Necesito cuatro cosas, en este orden: qué vale la pena proteger y cómo; qué alcance y qué clases; tu análisis de antecedentes cuando llegue la búsqueda; y una recomendación que yo pueda defender ante el cliente y ante su consejo.')+P('El presupuesto aprobado cubre tres solicitudes ante el IMPI; cada solicitud de marca abarca una sola clase. Si propones más, el consejo tiene que aprobarlo y eso toma dos o tres semanas. Nuestro objetivo interno es presentar en la semana 4: la fecha de presentación importa.')+P('Te dejo en el expediente la ficha del cliente, su brief, el correo de Valeria y la cronología.')+P('Sofía'));}},
 ficha:{t:'Ficha del cliente',w:'Semana 1',o:1,r:function(){return '<div class="doc"><h4>Ficha del cliente</h4><h3>Orígenes Fermentados del Sureste, S.A.P.I. de C.V.</h3><dl class="kv">'+[['Cliente','Orígenes Fermentados del Sureste, S.A.P.I. de C.V.'],['Sede','Querétaro, Qro. Planta piloto propia; cacao comprado a dos cooperativas de Tabasco y Chiapas'],['Antigüedad y tamaño','Dos años de operación como proveedor de cacao fermentado a granel; 14 colaboradores'],['Interlocutores','Valeria Ortega Lugo, directora general y cofundadora · Andrés Pimentel Rubio, director comercial y cofundador'],['Proyecto','Lanzamiento de su primera marca de consumo: XOKANA'],['Producto principal','Bebida de cacao fermentado, lista para beber, sin lácteos, baja en azúcar, no alcohólica, en botella de vidrio ámbar de 330 ml. Dos sabores: Original y Canela-Chile'],['Producto secundario','Cacao fermentado en polvo para preparar bebidas en casa (bolsa de 250 g)'],['Canales','Tienda en línea propia (xokana.mx), suscripción mensual “Club XOKANA”, cafeterías de especialidad y gimnasios boutique en CDMX, Querétaro y Monterrey, marketplaces'],['Fecha objetivo','Lanzamiento en la Semana 20 desde la apertura del expediente'],['Inversión','Ronda semilla encabezada por el fondo Semilla Pacífico Capital; cierre previsto en la Semana 12. El fondo pidió conocer la estrategia de protección marcaria como parte de su revisión'],['Presupuesto de protección aprobado','Tres solicitudes ante el IMPI, honorarios incluidos. Cada solicitud de marca abarca una sola clase; un aviso comercial también cuenta como una solicitud. Ampliarlo requiere aprobación del consejo (2 a 3 semanas)'],['Proveedor de identidad gráfica','Estudio Lumbre (Mariana Ceja, diseñadora independiente). Encargo acordado por mensajes con base en una cotización; pago contra factura; sin contrato firmado']].map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>'+P('<b>Origen del nombre (según el cliente):</b> XOKANA es una palabra inventada. “Xoko” evoca el xocolatl; “kana” se eligió por sonoridad. Internamente lo pronuncian “sho-KÁ-na”. No tiene significado en español ni en otra lengua conocida por los fundadores.')+FOOT+'</div>';}},
 brief:{t:'Brief comercial XOKANA',w:'Semana 1',o:1,r:function(){return '<div class="doc"><h4>Brief comercial · redactado por el cliente</h4><h3>XOKANA</h3>'+P('<b>Qué lanzamos.</b> XOKANA es la primera bebida de cacao fermentado lista para beber del mercado mexicano. Fermentamos el grano con una cepa seleccionada y un perfil de proceso que desarrollamos durante 18 meses con un laboratorio externo de alimentos. El resultado es una bebida ligera, ácida y especiada, sin lácteos, con cultivos activos al momento del envasado.')+P('<b>Cómo lo vamos a vender.</b> Tienda en línea y suscripción mensual (Club XOKANA). Distribución en cafeterías de especialidad y gimnasios boutique. A partir del tercer mes, una Caja Origen trimestral con nuestra bebida, chocolates de dos productores aliados (cada uno con su propia marca) y una taza de cerámica.')+P('<b>Experiencias.</b> Catas y talleres “Del árbol a la taza”, con boleto pagado, desde el segundo mes.')+P('<b>Lo que viene.</b> Barra XOKANA, una cafetería de cacao en CDMX, en unos 18 meses si cerramos la ronda. Barras de cacao fermentado en el segundo año. Vasos térmicos y playeras para la comunidad. Nuestro inversionista sugirió una línea cosmética con manteca de cacao; no tiene plan ni fecha.')+'<p><b>Identidad.</b></p><ul><li>Nombre: XOKANA.</li><li>Logotipo: una X formada por dos mazorcas de cacao cruzadas dentro de un círculo, en terracota y verde salvia, con la palabra XOKANA debajo en tipografía sans serif. Lo diseñó Estudio Lumbre: Mariana nos mandó una cotización por mensaje, la aceptamos y pagamos contra factura.</li><li>Slogan: “Cacao vivo, energía real.”</li><li>En la etiqueta, debajo del nombre, aparecerá CACAO VIVO como nombre de la categoría. Queremos registrarlo para que nadie más lo use.</li><li>Envase: botella ámbar estándar de 330 ml con etiqueta vertical de papel kraft y una franja terracota.</li><li>Dominio xokana.mx y cuentas @xokana.mx en redes. El dominio xokana.com está ocupado; no sabemos por quién.</li></ul>'+P('<b>Posicionamiento.</b> Bebida funcional para gente activa: energía sin azúcar añadida, con cultivos vivos.')+FOOT+'</div>';}},
 correo_v1:{t:'Correo de Valeria Ortega — lo que necesitamos',w:'Semana 1',o:1,r:function(){return mail('Valeria Ortega Lugo',ME,'XOKANA — lo que necesitamos',P('Hola. Gracias por tomar el proyecto. Te comparto el brief. Para nosotros lo importante es simple: queremos registrar todo como marca. El nombre, el logo, el slogan, CACAO VIVO, y que nadie pueda usar XOKANA en nada que tenga que ver con cacao, bebidas, cafeterías o cosméticos.')+P('El fondo va a revisar la estrategia antes de cerrar la ronda en la semana 12, y lanzamos en la semana 20. Las etiquetas se mandan a imprenta en la semana 8.')+P('Andrés te va a escribir sobre la descripción de productos; él insiste en que digamos “bebida funcional y energética”, que es como la vamos a vender.')+P('Valeria'));}},
 cronologia:{t:'Cronología del asunto',w:'Semana 1',o:1,r:function(){return '<div class="doc"><h4>Expediente XOKANA</h4><h3>Cronología del asunto</h3>'+tbl(['Momento','Hito'],[['Semana 1','Apertura del expediente'],['Semanas 2–3','Definición de estrategia; búsqueda de antecedentes'],['Semana 4','Presentación de solicitudes (objetivo interno)'],['Semana 8','Etiquetas a imprenta'],['Semana 12','Cierre de la ronda semilla'],['Semana 20','Lanzamiento comercial'],['Mes 18 aprox.','Barra XOKANA en CDMX, si se cierra la ronda']])+FOOT+'</div>';}},
 inventario:{t:'Inventario de elementos del proyecto',w:'Semana 1',o:1.1,r:function(){return '<div class="doc"><h4>Expediente XOKANA</h4><h3>Inventario de elementos del proyecto</h3>'+tbl(['#','Elemento','Descripción','Se decide en'],[['1','Denominación XOKANA','Palabra inventada; nombre del producto y de la línea','1.2'],['2','Logotipo','Isotipo (X de dos mazorcas cruzadas en un círculo) y la palabra XOKANA. Encargado a Estudio Lumbre: cotización por mensaje, pago contra factura, sin contrato firmado','1.2 (registro) y 1.3 (derechos)'],['3','CACAO VIVO','Frase que aparecerá bajo el nombre como “categoría” del producto','1.1'],['4','Slogan','“Cacao vivo, energía real.”, para etiqueta, redes y punto de venta','1.1'],['5','Envase','Botella ámbar estándar de 330 ml, etiqueta vertical kraft con franja terracota','1.1'],['6','Proceso y receta','Cepa seleccionada y perfil de fermentación desarrollados con un laboratorio externo','1.1'],['7','Dominio y redes','xokana.mx y @xokana.mx; xokana.com ocupado por un tercero no identificado','1.1'],['8','Club XOKANA','Nombre del programa de suscripción mensual','1.1']].map(function(r){return r.map(esc);}))+FOOT+'</div>';}},
 nota_cacao:{t:'Nota de Sofía — CACAO VIVO',w:'Semana 1',o:1.2,r:function(){return memo('Sofía Arellano, socia responsable','CACAO VIVO',P('Propones registrar CACAO VIVO. Para una bebida de cacao con cultivos activos, ¿cómo lo defenderías frente a un examen de distintividad? Si lo mantienes, ocupa una de las tres solicitudes.'));}},
 nota_slogan:{t:'Nota de Sofía — slogan',w:'Semana 1',o:1.2,r:function(){return memo('Sofía Arellano, socia responsable','Slogan',P('Propones el slogan como marca. ¿Va a funcionar como signo que distingue el origen del producto o como frase para anunciarlo? Si es lo segundo, existe una figura pensada para eso. Si lo mantienes como marca, dime por qué en una línea.'));}},
 correo_encargo:{t:'Correo de Valeria Ortega — logotipo',w:'Semana 2',o:2,r:function(){return mail('Valeria Ortega Lugo',ME,'Logotipo — Estudio Lumbre',P('Revisamos lo del logotipo como sugeriste. Te comparto la cotización que nos mandó Mariana. Le preguntamos y dice que siempre entendió que el logo es nuestro; está dispuesta a firmar un documento que lo confirme, siempre que pueda mostrarlo en su portafolio.'));}},
 cotizacion:{t:'Cotización de Estudio Lumbre (extracto)',w:'Semana 2',o:2.05,r:function(){return '<div class="doc"><h4>Documento proporcionado por el cliente</h4><h3>Estudio Lumbre · Cotización (extracto)</h3><dl class="kv"><dt>Proyecto</dt><dd>Identidad gráfica XOKANA</dd><dt>Entregables</dt><dd>Logotipo, isotipo, paleta de color y archivos editables</dd><dt>Uso</dt><dd>Lanzamiento de marca (empaque y redes sociales)</dd><dt>Plazo</dt><dd>Tres semanas</dd><dt>Pago</dt><dd>100 % contra entrega</dd></dl>'+FOOT+'</div>';}},
 cartera:{t:'Cartera de productos y servicios',w:'Semana 2',o:2.1,r:function(){return '<div class="doc"><h4>Expediente XOKANA</h4><h3>Cartera de productos y servicios</h3>'+tbl(['Código','Línea','Inicio','Ingresos estimados año 1','Comentario del cliente'],LINES.map(function(l){return l.map(esc);}))+FOOT+'</div>';}},
 correo_andres_red:{t:'Correo de Andrés Pimentel — descripción',w:'Semana 2',o:2.2,r:function(){return mail('Andrés Pimentel Rubio',ME,'Descripción de productos',P('Para la descripción, por favor usemos lo que dice nuestra presentación a inversionistas: bebida funcional, energética y probiótica. Si no decimos “energética”, ¿cómo nos protegemos de que alguien copie la idea con una bebida energética de cacao?'));}},
 reaccion:{t:'Correo del cliente — alcance propuesto',w:'Semana 2',o:2.3,r:function(){var a=alcance();if(a==='EXTENSO')return mail('Andrés Pimentel Rubio',ME,'Re: alcance','<p>¡Eso es! Mejor que sobre a que falte.</p>');if(a==='ACOTADO')return mail('Valeria Ortega Lugo',ME,'Re: alcance','<p>Entiendo empezar por lo esencial. ¿Y la Caja Origen y la barra? El fondo seguramente preguntará cómo protegemos la expansión.</p>');return mail('Valeria Ortega Lugo',ME,'Re: alcance','<p>Me parece razonable. Sólo quiero entender: si después abrimos la barra, ¿alguien puede adelantarse con el nombre?</p>');}},
 niza:{t:'Extracto orientativo de clases',w:'Semana 2',o:2.4,r:function(){return '<div class="doc"><h4>Material de consulta</h4><h3>Extracto orientativo de clases</h3><p class="sim2" style="margin:0 0 10px">Resumen elaborado para la simulación. No sustituye la Clasificación de Niza vigente ni las herramientas de clasificación del IMPI.</p>'+tbl(['Clase','Contenido general (paráfrasis)'],CLASSES.map(function(c){return [String(c[0]),esc(c[1])];}))+FOOT+'</div>';}},
 nota_presupuesto:{t:'Nota de Sofía — presupuesto',w:'Semana 2',o:2.5,r:function(){var n=proposal().length;return memo('Sofía Arellano, socia responsable','Presupuesto de solicitudes',P('Tu propuesta implica '+n+' solicitudes y el presupuesto aprobado cubre tres. Ordénalas por prioridad. Las tres primeras se presentan en la semana 4; las demás esperan la aprobación del consejo.'));}},
 busqueda:{t:'Informe de búsqueda de antecedentes',w:'Semana 3',o:3,r:function(){return '<div class="doc">'+SIMR+'<div class="sim2">No proviene de las bases de datos del IMPI ni de ninguna fuente real.</div><h4>Informe de búsqueda de antecedentes</h4><h3>Signo buscado: XOKANA</h3><dl class="kv"><dt>Signo buscado</dt><dd>XOKANA (denominación) y elemento figurativo (X formada por dos mazorcas cruzadas dentro de un círculo).</dd><dt>Criterios</dt><dd>Lecturas de la X inicial como /s/, /sh/, /j/ y /ks/ (SOKANA, SHOKANA, JOKANA, KSOKANA); variantes gráficas (XOCANA, XOKAN*, *OKANA); clases 5, 29, 30, 32, 35, 41, 43 y relacionadas; figuras de mazorcas, granos de cacao y letra X en círculo.</dd><dt>Registros revisados</dt><dd>37</dd><dt>Relevantes</dt><dd>4 (ver fichas A1 a A4)</dd><dt>Anexo figurativo</dt><dd>9 registros vigentes en clase 30, de titulares distintos, que usan mazorcas o granos de cacao como elemento figurativo.</dd></dl>'+tbl(['Ficha','Signo','Clase','Estado'],[['A1','SOCANA','32','Registro vigente'],['A2','MAZÁNTICA y diseño','30','Registro vigente'],['A3','XOKANA','9 y 42','Registros vigentes'],['A4','XOKAN','43','Solicitud en trámite']])+FOOT+'</div>';}},
 ant_A1:{t:'Ficha A1 · SOCANA',w:'Semana 3',o:3.01,r:function(){return antDoc('A1');}},
 ant_A2:{t:'Ficha A2 · MAZÁNTICA y diseño',w:'Semana 3',o:3.02,r:function(){return antDoc('A2');}},
 ant_A3:{t:'Ficha A3 · XOKANA (software)',w:'Semana 3',o:3.03,r:function(){return antDoc('A3');}},
 ant_A4:{t:'Ficha A4 · XOKAN (cafeterías)',w:'Semana 3',o:3.04,r:function(){return antDoc('A4');}},
 correo_v2:{t:'Correo de Valeria Ortega — búsqueda',w:'Semana 3',o:3.1,r:function(){return mail('Valeria Ortega Lugo',ME,'¿Qué hacemos?',P('Sofía me comentó que salió algo en la búsqueda. ¿Significa que no podemos usar XOKANA? El fondo ya vio el nombre en nuestra presentación y las etiquetas van a imprenta en la semana 8. Necesito tu recomendación esta semana: qué hacemos, qué riesgo corremos y qué cuesta.'));}},
 correo_andres_logo:{t:'Correo de Andrés Pimentel — logotipo',w:'Semana 3',o:3.11,r:function(){return mail('Andrés Pimentel Rubio',ME,'Logo — mensaje de Estudio Lumbre',P('Mariana, de Estudio Lumbre, vio que vamos a registrar el logo. Nos escribió que su cotización decía “uso: lanzamiento de marca” y que, si lo vamos a registrar y usar en otros productos, quiere platicar los términos. Además, el fondo nos pidió acreditar que el logotipo es nuestro. ¿Tiene razón? ¿Podemos registrarlo así? Te adjunto la cotización.'));}},
 respuesta_e3:{t:'Correo de Valeria Ortega — cambio de nombre',w:'Semana 3',o:3.2,r:function(){return mail('Valeria Ortega Lugo',ME,'Re: recomendación',P('Lo entiendo, pero cambiar el nombre a quince semanas del lanzamiento significa rehacer marca, empaque y presentación al fondo. El consejo decidió seguir con XOKANA. Dime cuál es la mejor ruta con ese nombre.'));}},
 carta_socana:{t:'Respuesta de los representantes del titular de SOCANA',w:'Semana 3',o:3.5,r:function(){return '<div class="doc">'+SIMB+'<h4>Correspondencia</h4><h3>Re: XOKANA / SOCANA</h3><div class="mailh"><div><span>De</span><b>Representantes de Embotelladora Sierra Azul, S.A. de C.V.</b></div><div><span>Para</span>'+esc(ME)+'</div></div>'+P('Nuestra representada conserva interés en su marca y evalúa opciones para ella. Estaría dispuesta a explorar un convenio de coexistencia siempre que su cliente: (i) no solicite ni use la denominación en la clase 32; (ii) no describa sus productos como bebidas energéticas o isotónicas; (iii) use la denominación acompañada de su propia identidad gráfica. Podríamos tener un documento firmado en seis a ocho semanas (plazo simulado).')+FOOT+'</div>';}},

var RO=false;

function dis(){return RO?' disabled':'';}

function sel(path,opts,val,label,disabled,ph){var id=idOf(path);return (label?'<label class="mini" for="'+id+'">'+esc(label)+'</label>':'')+'<select id="'+id+'" data-k="'+path+'"'+(RO||disabled?' disabled':'')+'><option value="">'+esc(ph||'Selecciona…')+'</option>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(val)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}
function counter(id,v,min,max,optional){var n=len(v);return '<div class="cnt'+(!optional&&n<min?' short':'')+'" id="'+id+'_c"><span>'+n+' / '+max+' caracteres</span><span>'+(optional?'Opcional':'Mínimo '+min)+'</span></div>';}
function ta(path,label,min,max,o){o=o||{};var v=getP(path)||'';var id=idOf(path);return '<label class="fl" for="'+id+'">'+label+'</label><textarea class="ta'+(o.long?' long':'')+'" id="'+id+'" data-k="'+path+'" data-min="'+min+'" data-max="'+max+'"'+(o.optional?' data-opt="1"':'')+' maxlength="'+max+'"'+dis()+'>'+esc(v)+'</textarea>'+counter(id,v,min,max,o.optional);}

document.addEventListener('change',function(e){var t=e.target;if(!t.getAttribute||!t.getAttribute('data-k'))return;if(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type==='text'))return;onField(t,false);});
document.addEventListener('input',function(e){var t=e.target;if(!t.getAttribute||!t.getAttribute('data-k'))return;if(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type==='text'))onField(t,true);});
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='startForm'){e.preventDefault();var errs=[];if(len(S.name)<2)errs.push('Escribe tu nombre (al menos 2 caracteres).');if(errs.length){showErrors(errs);return;}S.entered=true;S.started=new Date().toISOString();S.phase=0;S.view=0;showCover=false;['asignacion','ficha','brief','correo_v1','cronologia'].forEach(function(id){unlock(id);});hist('Expediente abierto.');save();render(true);}});
document.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-act]'):null;if(!b)return;var a=b.getAttribute('data-act');
 if(a==='toggle-exp'){var o=document.body.classList.toggle('exp-open');document.getElementById('expBtn').setAttribute('aria-expanded',o?'true':'false');if(o){var f=document.querySelector('#exp .exp-item,#exp .exp-close');if(f)f.focus();}return;}
 if(a==='open-doc'){openDoc(b.getAttribute('data-id'));return;}
 if(a==='close-modal'){closeModal();return;}
 if(a==='resume'){showCover=false;render(true);return;}
 if(a==='reset'){openModalHTML('Reiniciar expediente','<div class="doc"><p>Se borrarán de este navegador todas tus decisiones, textos, documentos desbloqueados y el informe. Esta acción no se puede deshacer.</p><div class="btnrow"><button type="button" class="btn warn" data-act="reset-ok">Sí, reiniciar el expediente</button><button type="button" class="btn sec" data-act="close-modal">Cancelar</button></div></div>');return;}
 if(a==='reset-ok'){try{localStorage.removeItem(KEY);}catch(er){}S=blank();showCover=false;closeModal();render(true);return;}
 if(a==='next'){if(S.view!==S.phase)return;var errs=S.phase===0?[]:validate(S.phase);if(errs.length){showErrors(errs);return;}advance(S.phase);return;}
 if(a==='goto'){var to=parseInt(b.getAttribute('data-to'),10);if(to>S.phase&&!(to===9&&S.phase>=8))return;S.view=to;save();render(true);return;}
 if(a==='ord'){var path=b.getAttribute('data-path'),i=parseInt(b.getAttribute('data-i'),10),d=parseInt(b.getAttribute('data-d'),10);var arr=getP(path).slice();var j=i+d;if(j<0||j>=arr.length)return;var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;setP(path,arr);afterSet(path);save();render(false);var btns=document.querySelectorAll('[data-act="ord"][data-path="'+path+'"][data-i="'+j+'"][data-d="'+d+'"]');if(btns[0]&&!btns[0].disabled)btns[0].focus();else{var alt=document.querySelector('[data-act="ord"][data-path="'+path+'"][data-i="'+j+'"]:not([disabled])');if(alt)alt.focus();}return;}
 if(a==='print'){window.print();return;}
 if(a==='copy'){copyReport();return;}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('modal').classList.contains('open'))closeModal();else if(document.body.classList.contains('exp-open')){document.body.classList.remove('exp-open');document.getElementById('expBtn').setAttribute('aria-expanded','false');document.getElementById('expBtn').focus();}}
 if(e.key==='Tab'&&document.getElementById('modal').classList.contains('open')){var f=document.querySelectorAll('#modal button,#modal [href],#modal input');if(!f.length)return;var first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal();});
function copyReport(){var el=document.getElementById('report');if(!el)return;var txt=el.innerText;function ok(){toast('Informe copiado al portapapeles.');}function fb(){var t=document.createElement('textarea');t.value=txt;t.setAttribute('readonly','');t.style.position='fixed';t.style.top='-1000px';document.body.appendChild(t);t.select();var done=false;try{done=document.execCommand('copy');}catch(er){}document.body.removeChild(t);if(done)ok();else toast('No fue posible copiar automáticamente. Selecciona el texto del informe y cópialo manualmente.');}
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fb);}else fb();}

save();render(true);
})();
</script>
</body>
</html>
