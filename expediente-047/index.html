<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Expediente 047</title>
<style>
:root{
  --paper:#f3f0e8;
  --sheet:#fffdf8;
  --sheet-2:#f8f5ee;
  --ink:#1b2027;
  --ink-2:#3a414a;
  --muted:#5d636b;
  --rule:#d8d1c3;
  --rule-strong:#b9b0a0;
  --accent:#213d55;
  --accent-soft:#e3e9ef;
  --tag:#7a5512;
  --tag-soft:#f4ead3;
  --focus:#1f63b8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --radius:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden}
img,svg{max-width:100%}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0 0 .5em;color:var(--ink)}
h1{font-size:2rem;letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
h4{font-size:1rem}
p{margin:0 0 .8em}
small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;z-index:100;text-decoration:none}
.skip:focus{top:8px}

/* ---------- Header ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--ink);color:#f3f0e8;border-bottom:3px solid var(--accent)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font-family:var(--mono);font-size:.82rem;letter-spacing:.18em;font-weight:700;text-transform:uppercase;white-space:nowrap}
.brand span{display:block;font-family:var(--sans);letter-spacing:.02em;text-transform:none;font-weight:400;font-size:.78rem;opacity:.75}
.clock{display:flex;flex-direction:column;line-height:1.2}
.clock-time{font-family:var(--mono);font-size:1.05rem;font-weight:700;letter-spacing:.04em}
.clock-stage{font-size:.8rem;opacity:.8}
.stagenav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.stagenav button{background:transparent;border:1px solid rgba(243,240,232,.35);color:#f3f0e8;border-radius:4px;padding:4px 9px;font-size:.78rem;font-family:var(--mono);cursor:pointer;min-width:34px}
.stagenav button[aria-current="step"]{background:#f3f0e8;color:var(--ink);font-weight:700}
.stagenav button.is-closed::after{content:" ✓";}
.stagenav button:disabled{opacity:.35;cursor:not-allowed}
.progress{font-size:.78rem;opacity:.85;white-space:nowrap}
.panel-toggles{display:none;gap:6px}
.panel-toggles button{background:#f3f0e8;color:var(--ink);border:0;border-radius:4px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:pointer}

.notice{max-width:1320px;margin:10px auto 0;padding:8px 20px;font-size:.85rem;color:var(--ink-2)}
.notice div{background:var(--tag-soft);border:1px solid #e3d3ae;border-radius:4px;padding:6px 10px}

/* ---------- Layout ---------- */
.layout{max-width:1320px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.layout.no-panel{grid-template-columns:minmax(0,1fr)}
main{min-width:0;outline:none}
.panel{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:0}
.panel[hidden]{display:none}
.panel-head{display:none;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.panel-tabs{display:flex;border-bottom:1px solid var(--rule)}
.panel-tabs button{flex:1;background:var(--sheet-2);border:0;border-right:1px solid var(--rule);padding:10px 6px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.panel-tabs button:last-child{border-right:0}
.panel-tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.panel-body{padding:14px}

/* ---------- Generic blocks ---------- */
.stage-head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
.stage-kicker{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.stage-head h1{font-size:1.9rem;margin:0}
.stage-intro{font-family:var(--serif);font-size:1.12rem;line-height:1.55;color:var(--ink-2);margin:16px 0 0;max-width:62ch}
.readonly-banner{background:var(--accent-soft);border:1px solid #c4d0dc;border-radius:4px;padding:8px 12px;font-size:.9rem;margin-bottom:18px}
.section{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 22px;margin:0 0 20px}
.section > h2{font-size:1.2rem;display:flex;gap:10px;align-items:baseline}
.section > h2 .num{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.hint{color:var(--muted);font-size:.92rem;margin-top:-4px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

fieldset{border:0;margin:0 0 14px;padding:0;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:6px}
fieldset[disabled] .choice{cursor:default}

/* choice rows: compact segmented */
.qrow{border-top:1px solid var(--rule);padding:12px 0}
.qrow:first-of-type{border-top:0}
.qrow legend{float:left;width:100%;font-weight:500;font-family:var(--serif);font-size:1.02rem;line-height:1.4}
.qrow .seg{clear:both}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);border-radius:4px;padding:5px 10px;font-size:.9rem;cursor:pointer;background:#fff}
.seg input{margin:0;accent-color:var(--accent)}
.seg label.is-on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}

/* option cards */
.cards{display:grid;gap:8px}
.card-opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--rule-strong);border-radius:var(--radius);padding:11px 13px;background:#fff;cursor:pointer}
.card-opt input{margin-top:4px;accent-color:var(--accent)}
.card-opt.is-on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:#f9fbfc}
.card-opt .opt-title{font-weight:600}
.card-opt .opt-mark{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--accent);margin-left:6px;white-space:nowrap}
.card-opt .opt-detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;font-size:.88rem}
.card-opt .opt-detail div{border-top:1px solid var(--rule);padding-top:6px}
.card-opt .opt-detail b{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card-opt.is-disabled{opacity:.55;cursor:not-allowed}

/* questions to Tomás */
.qlist{display:grid;gap:8px}
.qitem{border:1px solid var(--rule);border-radius:var(--radius);background:#fff;padding:10px 12px}
.qitem.asked{border-color:var(--accent);background:#f9fbfc}
.qitem .q{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qitem .q span{font-weight:500}
.qitem .ans{margin:10px 0 2px;padding:8px 12px;border-left:3px solid var(--accent);font-family:var(--serif);background:var(--sheet-2)}
.qitem .order{font-family:var(--mono);font-size:.75rem;color:var(--accent);font-weight:700;margin-right:6px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn:hover{background:#2b333d}
.btn.secondary{background:#fff;color:var(--ink)}
.btn.secondary:hover{background:var(--sheet-2)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

textarea,input[type=text],select{width:100%;border:1px solid var(--rule-strong);border-radius:4px;padding:9px 11px;background:#fff;line-height:1.5}
textarea{min-height:120px;resize:vertical;font-family:var(--serif);font-size:1.02rem}
textarea[readonly],input[readonly]{background:var(--sheet-2)}
.counter{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-top:4px}
.counter.out{color:#7a2e1f;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:5px}

/* close bar */
.closebar{border-top:2px solid var(--ink);padding-top:16px;margin-top:8px}
.missing{margin-top:12px;background:var(--tag-soft);border:1px solid #e3d3ae;border-radius:4px;padding:10px 14px;font-size:.92rem}
.missing ul{margin:6px 0 0;padding-left:20px}

/* document cards in stage */
.doccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doccard{text-align:left;display:block;width:100%;border:1px solid var(--rule-strong);border-radius:var(--radius);background:#fff;padding:10px 12px;cursor:pointer;position:relative}
.doccard:hover{border-color:var(--accent)}
.doccard .did{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.doccard .dtitle{display:block;font-family:var(--serif);font-weight:600;margin:2px 0 4px;line-height:1.3}
.doccard .dmeta{font-size:.78rem;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-right:4px;line-height:1.6}
.tag.late{color:var(--tag);background:var(--tag-soft)}
.tag.unread{color:var(--accent)}
.tag.read{color:var(--muted)}

/* tray list in panel */
.tray{list-style:none;margin:0;padding:0}
.tray li{border-bottom:1px solid var(--rule)}
.tray li:last-child{border-bottom:0}
.tray button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 2px;cursor:pointer}
.tray button:hover .ttitle{text-decoration:underline}
.tray .ttitle{display:block;font-weight:600;font-size:.92rem;line-height:1.3}
.tray .tmeta{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.tray-group{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.tray-group:first-child{margin-top:0}

.log{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule-strong)}
.log li{position:relative;padding:0 0 12px 14px;font-size:.88rem}
.log li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--rule-strong)}
.log time{display:block;font-family:var(--mono);font-size:.74rem;color:var(--muted);font-weight:700}

.advice{list-style:none;margin:0;padding:0}
.advice li{border:1px solid var(--rule);border-radius:4px;padding:9px 11px;margin-bottom:8px;background:#fff}
.advice .when{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-weight:700;display:block}
.advice .what{font-size:.9rem}
.advice .lock{font-size:.72rem;color:var(--muted)}

/* ---------- Document viewer ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(860px,96vw);width:100%;max-height:92vh}
dialog::backdrop{background:rgba(20,24,30,.55)}
.viewer{background:var(--sheet);border-radius:8px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.viewer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule);background:var(--sheet-2)}
.viewer-head .did{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-weight:700}
.viewer-head h2{margin:0;font-size:1.2rem}
.viewer-body{overflow:auto;padding:20px}
.doc{background:#fff;border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule);padding:26px 28px;font-family:var(--serif);font-size:1.02rem;line-height:1.6;color:#1d1d1d}
.doc p{margin:0 0 .85em}
.doc .lh{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid #1d1d1d;padding-bottom:8px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.doc .lh b{letter-spacing:.14em}
.doc .mailhead{font-family:var(--sans);font-size:.88rem;border:1px solid var(--rule);background:var(--sheet-2);padding:8px 12px;margin-bottom:14px;border-radius:3px}
.doc .mailhead div{display:flex;gap:8px}
.doc .mailhead b{min-width:58px;color:var(--muted);font-weight:600}
.doc .sep{border:0;border-top:1px dashed var(--rule-strong);margin:16px 0}
.doc table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:.88rem;margin:8px 0 14px}
.doc th,.doc td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--sheet-2);font-weight:600}
.doc .props td:first-child{font-family:var(--mono);font-size:.82rem;width:38%;background:var(--sheet-2)}
.doc .note{font-family:var(--sans);font-size:.88rem;background:var(--tag-soft);border-left:3px solid var(--tag);padding:6px 10px;margin:10px 0}
.doc .quote{border-left:3px solid var(--rule-strong);padding-left:12px;margin:10px 0;color:#2b2b2b}
.doc ol,.doc ul{margin:0 0 .9em;padding-left:22px}
.doc .sig{margin-top:18px}
.doc .legend{font-family:var(--sans);font-size:.78rem;color:var(--muted);font-style:italic;border-top:1px solid var(--rule);margin-top:20px;padding-top:8px}
.doc .simlabel{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--rule-strong);padding:4px 8px;display:inline-block;margin-bottom:10px;color:var(--ink-2)}
.doc .layer-hidden{font-weight:700}
.doc .version-tag{font-family:var(--mono);font-size:.74rem;border:1px solid var(--rule-strong);padding:1px 6px;border-radius:3px;margin-left:6px}
.doc .scrawl{font-family:var(--sans);font-size:.9rem;font-style:italic}

/* ---------- Timeline 3.1 ---------- */
.tl-grid{display:grid;gap:10px}
.tl-card{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:10px;align-items:center}
.tl-card .tl-name{font-weight:600}
.tl-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.tl-col h3{font-size:1rem}
.tl-zone{border-top:1px solid var(--rule);padding:6px 0}
.tl-zone b{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tl-zone ul{margin:4px 0 0;padding-left:18px;font-size:.9rem}
.doclist{list-style:none;padding:0;margin:0;font-size:.9rem}
.doclist li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:5px 0;border-bottom:1px dotted var(--rule)}
.doclist li span:first-child{font-family:var(--mono);font-size:.8rem;color:var(--muted)}

/* ---------- Classification ---------- */
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.defs div{border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:var(--sheet-2);font-size:.88rem}
.defs b{display:block;font-size:.92rem}
.rewrite{list-style:none;margin:10px 0 0;padding:0;counter-reset:rw}
.rewrite li{counter-increment:rw;border-left:3px solid var(--accent);background:#fff;padding:8px 12px;margin-bottom:8px;font-family:var(--serif)}
.rewrite li::before{content:counter(rw) ". ";font-family:var(--mono);font-size:.8rem;color:var(--muted)}

/* ---------- Revelations ---------- */
.news{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0 0 18px}
.news ul{margin:6px 0 0;padding-left:20px}

/* ---------- Cover ---------- */
.cover{max-width:760px;margin:30px auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cover-band{background:var(--ink);color:#f3f0e8;padding:30px 34px 26px;position:relative}
.cover-band .fileno{font-family:var(--mono);letter-spacing:.24em;font-size:.82rem;opacity:.75;margin-bottom:10px}
.cover-band h1{color:#f3f0e8;font-size:2.6rem;letter-spacing:.06em;margin:0}
.cover-band .subtitle{font-family:var(--serif);font-style:italic;font-size:1.2rem;margin-top:8px;opacity:.92}
.cover-body{padding:26px 34px 30px}
.cover-body ul{padding-left:20px;margin:0 0 18px}
.cover-body li{margin-bottom:4px}
.stamp{display:inline-block;border:2px solid var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:.72rem;padding:3px 8px;transform:rotate(-2deg);margin-bottom:14px}
.resume{background:var(--accent-soft);border:1px solid #c4d0dc;border-radius:6px;padding:14px 16px;margin-bottom:18px}

/* ---------- Closing / report ---------- */
.evo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 6px;position:relative}
.evo-pt{border:1px solid var(--rule-strong);border-radius:4px;background:#fff;padding:10px;font-size:.88rem;align-self:start}
.evo-pt .when{font-family:var(--mono);font-size:.74rem;font-weight:700;color:var(--muted);display:block}
.evo-pt .opt{font-weight:600;display:block;margin:4px 0}
.evo-pt .between{font-size:.8rem;color:var(--muted);border-top:1px dotted var(--rule);padding-top:5px;margin-top:5px}
.evo-scale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-family:var(--mono)}
.obs{list-style:none;padding:0;margin:8px 0 0}
.obs li{padding:8px 0 8px 14px;border-left:2px solid var(--rule-strong);margin-bottom:6px;font-family:var(--serif)}
.dim{border-top:1px solid var(--rule);padding:14px 0}
.dim:first-of-type{border-top:0}
.dim h3{font-size:1.05rem;margin-bottom:6px}
.dim dl{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px}
.dim dt{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.dim dd{margin:0;font-family:var(--serif)}
.traj-detail{border:1px solid var(--rule-strong);border-radius:6px;padding:16px 18px;background:#fff}
.traj-detail dl{margin:0;display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 14px}
.traj-detail dt{font-weight:600;font-size:.9rem}
.traj-detail dd{margin:0}
.traj-others{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.traj-others div{border:1px solid var(--rule);border-radius:6px;padding:12px;background:var(--sheet-2);font-size:.9rem}
.traj-others h4{margin-bottom:6px}
.report{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:28px 32px}
.report-title{border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:16px}
.report-title .rk{font-family:var(--mono);font-size:.78rem;letter-spacing:.2em;color:var(--muted)}
.report-title h2{font-size:1.6rem;margin:2px 0 0}
.rsec{margin:0 0 18px;break-inside:avoid;page-break-inside:avoid}
.rsec.long{break-inside:auto;page-break-inside:auto}
.rsec h3{font-size:1.02rem;border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:8px}
.rsec h3 .n{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-right:6px}
.rsec table{width:100%;border-collapse:collapse;font-size:.88rem;margin:4px 0}
.rsec th,.rsec td{border:1px solid var(--rule);padding:5px 7px;text-align:left;vertical-align:top}
.rsec th{background:var(--sheet-2)}
.rsec .free{white-space:pre-wrap;font-family:var(--serif);border-left:3px solid var(--rule-strong);padding:4px 0 4px 12px}
.rsec ul{margin:0;padding-left:20px}
.report-foot{font-size:.8rem;color:var(--muted);font-style:italic;border-top:1px solid var(--rule);padding-top:8px;margin-top:20px}
.table-wrap{overflow-x:auto;max-width:100%}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}

@media print{
  @page{margin:16mm 14mm}

function partText(p){

  if (p.list) p.list.forEach(function(x){ t += '- ' + x + '\n'; });

  if (p.para) t += p.para + '\n';
  return t;
}
function informeTexto(s){

function checkCards(name, opts, values, legend, max){

function docCard(d){

function docsSection(list, title){

function stageHead(n, intro){

function closeBar(n){

function textCounterChars(id, value, max){
  return '<div class="counter" id="' + id + '_count">' + (value || '').length + ' / ' + max + ' caracteres</div>';

function textCounterWords(id, value, range){

/* =========================================================

   ========================================================= */
function renderPanel(){
  var s = state;
  var docs = E.docsHasta(s, Math.min(s.etapaActual, 5));
  var groups = {};
  var order = [];
  docs.forEach(function(d){ var g = d.hora.split(' · ')[0] + ' · ' + d.hora.split(' · ')[1]; if (!groups[g]){ groups[g] = []; order.push(g); } groups[g].push(d); });
  var hb = '<h2 class="sr-only">Bandeja de documentos</h2>';
  if (!docs.length) hb += '<p class="muted">Sin documentos.</p>';
  order.forEach(function(g){
    var late = groups[g][0].tarde;
    hb += '<div class="tray-group">' + esc(g) + (late ? ' · fuera de tiempo' : '') + '</div><ul class="tray">';
    groups[g].forEach(function(d){
      var a = s.aperturas[d.id];
      hb += '<li><button type="button" data-action="open-doc" data-doc="' + d.id + '"><span class="ttitle">' + E.docCode(d.id) + ' · ' + esc(E.DOC_TITLES[d.id]) + '</span><span class="tmeta">' + (d.tarde ? '<span class="tag late">Recibido fuera de tiempo</span>' : '') + (a ? '<span class="tag read">Abierto</span>' + esc(a.etapaLabel + ' · ' + a.hora) : '<span class="tag unread">No abierto</span>') + '</span></button></li>';
    });
    hb += '</ul>';
  });
  document.getElementById('tp-bandeja').innerHTML = hb;
  var bit = E.bitacora(s);
  document.getElementById('tp-bitacora').innerHTML = '<h2 class="sr-only">Bitácora del expediente</h2><ul class="log">' + bit.map(function(b){ return '<li><time>' + esc(b.hora) + '</time>' + esc(b.t) + '</li>'; }).join('') + '</ul>';
  var adv = [];
  if (s.etapasCerradas[1]) adv.push({w:'Martes 10 · 10:00', t:(byId(E.P1, s.POSICION_1) || {}).t});
  if (s.etapasCerradas[3]) adv.push({w:'Martes 10 · 16:30', t:(byId(E.P2, s.POSICION_2) || {}).t});
  if (s.etapasCerradas[4]) adv.push({w:'Miércoles 11 · 12:00 · decisión', t:(byId(E.DECISIONES, s.DECISION_NEGOCIO) || {}).t});
  if (s.etapasCerradas[5]) adv.push({w:'Viernes 13 · posición final', t:(byId(E.FINALES, s.POSICION_FINAL) || {}).t});
  document.getElementById('tp-consejo').innerHTML = '<h2 class="sr-only">Tu consejo hasta ahora</h2>' + (adv.length ? '<ul class="advice">' + adv.map(function(a){ return '<li><span class="when">' + esc(a.w) + '</span><span class="what">' + esc(a.t) + '</span><span class="lock" style="display:block">Fijada</span></li>'; }).join('') + '</ul>' : '<p class="muted">Todavía no has fijado ninguna recomendación.</p>');
  ['bandeja','bitacora','consejo'].forEach(function(t){
    var tab = document.getElementById('tab-' + t), pane = document.getElementById('tp-' + t);
    var on = panelTab === t;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
    pane.hidden = !on;
  });
}
function syncPanelVisibility(){
  var show = state.etapaActual >= 0;
  if (!show){ $panel.hidden = true; $layout.classList.add('no-panel'); return; }
  if (mqDesktop.matches){ $panel.hidden = false; $layout.classList.remove('no-panel'); $panel.removeAttribute('role'); $panel.removeAttribute('aria-modal'); }
  else { $layout.classList.add('no-panel'); $panel.hidden = !panelOpenMobile; if (panelOpenMobile){ $panel.setAttribute('role','dialog'); $panel.setAttribute('aria-modal','true'); } }
}
function openPanelMobile(tab){
  panelTab = tab; panelOpenMobile = true; lastFocus = document.activeElement;
  renderPanel(); syncPanelVisibility();
  document.getElementById('tab-' + tab).focus();
}
function closePanelMobile(){
  panelOpenMobile = false; syncPanelVisibility();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function renderTop(){

  if (v >= 6){ document.getElementById('clockTime').textContent = 'Vie 13 · cierre'; document.getElementById('clockStage').textContent = 'Expediente cerrado'; }

  }

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(opts){
  opts = opts || {};
  var ae = document.activeElement, fid = ae && ae.id && $main.contains(ae) ? ae.id : null;
  var sy = window.scrollY;
  document.getElementById('storageNotice').hidden = storageOK || state.etapaActual < 0;
  if (state.etapaActual < 0 || view < 0){ $main.innerHTML = renderCover(); renderTop(); syncPanelVisibility(); bindCover(); return; }
  var fn = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4, renderStage5, renderCierre][view];
  $main.innerHTML = fn();
  renderTop(); renderPanel(); syncPanelVisibility();
  if (opts.focusTitle){ var t = document.getElementById('stageTitle'); if (t) t.focus(); window.scrollTo(0,0); }
  else {
    if (fid){ var el = document.getElementById(fid); if (el) { try { el.focus({preventScroll:true}); } catch(e){ el.focus(); } } }
    window.scrollTo(0, sy);
  }
}
function bindCover(){
  var f = document.getElementById('coverForm');
  if (!f) return;
  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var n = document.getElementById('pNombre').value.trim();
    var idv = document.getElementById('pId').value.trim();
    var m = document.getElementById('coverMissing');
    if (!n){ m.hidden = false; m.textContent = 'Falta el nombre del participante.'; document.getElementById('pNombre').focus(); return; }
    state = E.freshState();
    state.participante = {nombre:n, id:idv};
    state.etapaActual = 0; view = 0;
    saved = null;
    saveNow();
    render({focusTitle:true});
  });
}

/* =========================================================
   VALIDACIÓN Y CIERRE DE ETAPAS
   ========================================================= */
function missing(n){
  var s = state, M = [];
  if (n === 0){
    E.FRENTES.forEach(function(f){ if (!s.preocupacion0[f.id]) M.push('Preocupación inicial: ' + f.name + '.'); });
    E.AFIRMABLES.forEach(function(c){ if (!s.afirmables[c.id]) M.push('Frase sin contestar: «' + c.t + '».'); });
  }
  if (n === 1){
    if (s.preguntas.length < 3) M.push('Faltan ' + (3 - s.preguntas.length) + ' preguntas a Tomás (1.1).');
    if (!s.correoLucia) M.push('Falta decidir qué hacer con el correo de Lucía (1.2).');
    if (!s.conservacion1) M.push('Falta la instrucción de conservación (1.3).');
    if (s.verificaciones1.length !== 3) M.push('Debes elegir exactamente tres verificaciones (1.4); llevas ' + s.verificaciones1.length + '.');
    if (!s.POSICION_1) M.push('Falta tu recomendación (1.5).');
    if ((s.hechoAConfirmar || '').trim().length < 20) M.push('El hecho que más necesitas confirmar necesita al menos 20 caracteres (1.6).');
  }
  if (n === 2){
    FB.hallazgosEtapa2(s).forEach(function(x){
      var r = s.impacto[x.id] || {};
      if (!r.grado || !r.frente) M.push('Matriz incompleta: «' + x.t + '» (2.2).');
    });
    if (!s.verificacion2) M.push('Falta la cuarta verificación (2.3).');
    if (s.conservacion1 !== 'amplia' && !s.ampliaConservacion2) M.push('Falta decidir si amplías la instrucción de conservación (2.4).');
  }
  if (n === 3){
    E.tarjetasVisibles(s).forEach(function(k){ if (!s.tarjetas[k.id]) M.push('Tarjeta sin ubicar: ' + k.t + ' (3.1).'); });
    if (!s.tarjetasConfirmadas) M.push('Falta confirmar la ubicación de las tarjetas (3.1).');
    E.HIPOTESIS.forEach(function(x){ if (!s.hipotesis[x.id]) M.push('Hipótesis sin estado: ' + x.t + ' (3.2).'); });
    if (!s.POSICION_2) M.push('Falta tu recomendación de las 16:30 (3.3).');
    if (!s.autodescripcion2) M.push('Falta indicar si mantienes, ajustas o cambias tu recomendación (3.3).');
    var w = E.countWords(s.notaIrene);
    if (w < 60 || w > 150) M.push('La nota para Irene debe tener entre 60 y 150 palabras; tiene ' + w + ' (3.4).');
  }
  if (n === 4){
    E.AFS.forEach(function(a){ if (!s.clasificacion[a.id]) M.push('Afirmación sin clasificar: «' + a.t + '» (4.1).'); });
    if (!s.clasificacionConfirmada) M.push('Falta confirmar la clasificación (4.1).');
    if (!s.DECISION_NEGOCIO) M.push('Falta la decisión de negocio (4.3).');
    if ((s.fraseLucia || '').trim().length < 20) M.push('Lo que le dirías a Lucía necesita al menos 20 caracteres (4.4).');
  }
  if (n === 5){
    E.FRENTES.forEach(function(f){ if (!s.preocupacionF[f.id]) M.push('Preocupación final: ' + f.name + ' (5.1).'); });
    if (!s.POSICION_FINAL) M.push('Falta tu posición final (5.2).');
    var w5 = E.countWords(s.recomendacion);
    if (w5 < 180 || w5 > 220) M.push('La recomendación ejecutiva debe tener entre 180 y 220 palabras; tiene ' + w5 + ' (5.3).');
  }
  return M;
}
function showMissing(boxId, M){
  var box = document.getElementById(boxId);
  if (!box) return;
  if (!M.length){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = '<strong>Para continuar falta:</strong><ul>' + M.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
  announce('Para continuar falta: ' + M.join(' '));
}
function askConfirm(text, onOk){
  document.getElementById('confirmText').textContent = text;
  lastFocus = document.activeElement;
  var ok = document.getElementById('confirmOk'), cancel = document.getElementById('confirmCancel');
  function cleanup(){ ok.onclick = null; cancel.onclick = null; if ($cDlg.open) $cDlg.close(); }
  ok.onclick = function(){ cleanup(); onOk(); };
  cancel.onclick = function(){ cleanup(); if (lastFocus && lastFocus.focus) lastFocus.focus(); };
  $cDlg.onclose = function(){ ok.onclick = null; cancel.onclick = null; };
  if ($cDlg.showModal) $cDlg.showModal(); else $cDlg.setAttribute('open','');
  cancel.focus();
}
function closeStage(){
  var n = state.etapaActual;
  var M = missing(n);
  if (M.length){ showMissing('missing', M); return; }
  showMissing('missing', []);
  var next = E.STAGES[n].next;
  var txt = next ? 'Al pasar a las ' + next + ' no podrás cambiar lo que decidiste en esta etapa.' : 'Al cerrar el expediente no podrás cambiar lo que decidiste en esta etapa.';
  askConfirm(txt, function(){
    if (n === 3) state.cambioCalculado2 = E.cambioCalculado(state);
    state.etapasCerradas[n] = new Date().toISOString();
    state.etapaActual = n + 1;
    view = state.etapaActual;
    saveNow();
    render({focusTitle:true});
    announce(n < 5 ? 'Etapa ' + n + ' cerrada. Ahora: etapa ' + view + ', ' + E.STAGES[view].title + '.' : 'Expediente cerrado. Perfil e informe disponibles.');
  });
}

   DOCUMENTOS
   ========================================================= */
function openDoc(id){
  var d = null;
  E.docsHasta(state, Math.min(state.etapaActual, 5)).forEach(function(x){ if (x.id === id) d = x; });
  if (!d) return;
  if (!state.aperturas[id]){
    var et = state.etapaActual;
    state.aperturas[id] = {etapa:et, etapaLabel: et >= 6 ? 'Cierre' : 'Etapa ' + et, hora: et >= 6 ? 'Vie 13 · cierre' : E.STAGES[et].short};
    saveSoon();
  }
  lastFocus = document.activeElement;
  document.getElementById('docDialogId').textContent = E.docCode(id) + (d.tarde ? ' · Recibido fuera de tiempo' : '');
  document.getElementById('docDialogTitle').textContent = E.DOC_TITLES[id];
  document.getElementById('docDialogMeta').textContent = 'Recibido: ' + d.hora;
  document.getElementById('docDialogBody').innerHTML = '<div class="doc">' + E.renderDoc(id, state, d) + '</div>';
  if ($docDlg.showModal) $docDlg.showModal(); else $docDlg.setAttribute('open','');
  document.getElementById('docDialogBody').scrollTop = 0;
  document.getElementById('docDialogClose').focus();
}
function closeDoc(){
  if ($docDlg.open) $docDlg.close();
}
$docDlg.addEventListener('close', function(){
  renderPanel();
  // refrescar etiquetas de las tarjetas de documentos sin perder el foco
  var cards = $main.querySelectorAll('.doccard');
  for (var i=0;i<cards.length;i++){
    var id = cards[i].getAttribute('data-doc');
    var a = state.aperturas[id];
    var tagWrap = cards[i].lastElementChild;
    if (a && tagWrap){ tagWrap.innerHTML = tagWrap.innerHTML.replace('<span class="tag unread">No abierto</span>', '<span class="tag read">Abierto</span>'); }
  }
  if (lastFocus && document.body.contains(lastFocus) && lastFocus.focus) lastFocus.focus();
});
document.getElementById('docDialogClose').addEventListener('click', closeDoc);
$docDlg.addEventListener('click', function(ev){ if (ev.target === $docDlg) closeDoc(); });

/* =========================================================
   EVENTOS
   ========================================================= */
function setPath(path, value){
  var parts = path.split('.'), o = state;
  for (var i=0;i<parts.length-1;i++){ if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}
$main.addEventListener('change', function(ev){
  var t = ev.target;
  if (state.etapaActual < 0 || isRO()) return;
  if (t.hasAttribute('data-bind')){
    if (t.type === 'radio' && !t.checked) return;
    var path = t.getAttribute('data-bind');
    if (state.etapaActual === 3 && state.tarjetasConfirmadas && path.indexOf('tarjetas.') === 0) return;
    if (state.etapaActual === 4 && state.clasificacionConfirmada && path.indexOf('clasificacion.') === 0) return;
    setPath(path, t.value || null);
    if (path === 'conservacion1' && t.value === 'amplia') state.ampliaConservacion2 = null;
    saveSoon(); render();
    return;
  }
  if (t.hasAttribute('data-multi')){
    var key = t.getAttribute('data-multi'), max = parseInt(t.getAttribute('data-max') || '0', 10);
    var arr = state[key].slice();
    var i = arr.indexOf(t.value);
    if (t.checked && i < 0){
      if (max && arr.length >= max){ t.checked = false; announce('Ya elegiste ' + max + '. Desmarca una para cambiarla.'); return; }
      arr.push(t.value);
    }
    if (!t.checked && i >= 0) arr.splice(i, 1);
    state[key] = arr;
    if (key === 'verificaciones1' && state.verificacion2 && arr.indexOf(state.verificacion2) >= 0) state.verificacion2 = null;
    saveSoon(); render();
    return;
  }
  if (t.hasAttribute('data-autorrev')){
    var k = parseInt(t.getAttribute('data-autorrev'), 10);
    state.autorrevision[k] = t.checked;
    saveSoon(); render();
  }
});
$main.addEventListener('input', function(ev){
  var t = ev.target;
  if (!t.hasAttribute('data-text') || state.etapaActual < 0 || isRO()) return;
  var key = t.getAttribute('data-text');
  state[key] = t.value;
  var c = document.getElementById(t.id + '_count');
  if (c){
    if (t.hasAttribute('data-words')){
      var rg = t.getAttribute('data-words').split(',').map(Number);
      var n = E.countWords(t.value);
      c.textContent = n + ' palabras · ' + rg[0] + '–' + rg[1];
      c.classList.toggle('out', n > 0 && (n < rg[0] || n > rg[1]));
    } else {
      c.textContent = t.value.length + ' / ' + t.getAttribute('maxlength') + ' caracteres';
    }
  }
  saveSoon();
});
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-action]');
  if (!b) return;
  var a = b.getAttribute('data-action');
  if (a === 'open-doc'){ openDoc(b.getAttribute('data-doc')); return; }
  if (a === 'nav'){
    var st = parseInt(b.getAttribute('data-stage'), 10);
    if (st <= state.etapaActual){ view = st; render({focusTitle:true}); if (!mqDesktop.matches && panelOpenMobile) closePanelMobile(); }
    return;
  }
  if (a === 'resume'){
    state = saved; saved = null;
    view = Math.min(state.etapaActual, 6);
    render({focusTitle:true}); return;
  }
  if (a === 'new-file'){
    askConfirm('Se borrará el expediente guardado en este navegador y empezarás uno nuevo.', function(){
      clearStorage(); saved = null; savedError = false; state = E.freshState(); view = -1; render(); var n = document.getElementById('pNombre'); if (n) n.focus();
    });
    return;
  }
  if (a === 'print'){ window.print(); return; }
  if (a === 'copy'){ copyReport(); return; }
  if (state.etapaActual < 0 || isRO()) return;
  if (a === 'ask'){
    var q = b.getAttribute('data-q');
    if (state.preguntas.length >= 3 || state.preguntas.indexOf(q) >= 0){ announce('Ya no hay tiempo para más preguntas.'); return; }
    state.preguntas.push(q); saveSoon(); render(); focusEl('ans_' + q);
    var o = byId(E.PREGUNTAS, q); announce('Respuesta de Tomás: ' + o.a);
    return;
  }
  if (a === 'confirm-cards'){
    var Mk = E.tarjetasVisibles(state).filter(function(k){ return !state.tarjetas[k.id]; }).map(function(k){ return 'Tarjeta sin ubicar: ' + k.t + '.'; });
    if (Mk.length){ showMissing('cardsMissing', Mk); return; }
    state.tarjetasConfirmadas = true; saveSoon(); render(); focusEl('tlResultTitle'); announce('Ubicación confirmada. Se muestra la cronología documentada hasta ahora.');
    return;
  }
  if (a === 'confirm-class'){
    var Mc = E.AFS.filter(function(x){ return !state.clasificacion[x.id]; }).map(function(x){ return 'Afirmación sin clasificar: «' + x.t + '».'; });
    if (Mc.length){ showMissing('classMissing', Mc); return; }
    state.clasificacionConfirmada = true; saveSoon(); render(); focusEl('rewriteTitle'); announce('Clasificación confirmada. Se muestran las notas reescritas.');
    return;
  }
  if (a === 'insert-guide'){
    var ta = document.getElementById('recomendacion');
    var guide = 'Qué sabemos:\n\nQué no sabemos:\n\nQué recomendamos:\n\nQué se conserva o investiga:\n\nRiesgo abierto:\n';
    ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/,'') + '\n\n' : '') + guide;
    ta.dispatchEvent(new Event('input', {bubbles:true}));
    ta.focus();
    return;
  }
  if (a === 'close-stage'){ closeStage(); return; }
});
document.getElementById('stageNav').addEventListener('keydown', function(){});
document.getElementById('panelToggles').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-panel-open]'); if (!b) return;
  openPanelMobile(b.getAttribute('data-panel-open'));
});
document.getElementById('panelClose').addEventListener('click', closePanelMobile);
document.querySelector('.panel-tabs').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-tab]'); if (!b) return;
  panelTab = b.getAttribute('data-tab'); renderPanel(); b.focus();
});
document.querySelector('.panel-tabs').addEventListener('keydown', function(ev){
  if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
  var tabs = ['bandeja','bitacora','consejo'], i = tabs.indexOf(panelTab);
  i = (i + (ev.key === 'ArrowRight' ? 1 : 2)) % 3;
  panelTab = tabs[i]; renderPanel(); document.getElementById('tab-' + panelTab).focus();
  ev.preventDefault();
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && panelOpenMobile && !mqDesktop.matches && !$docDlg.open && !$cDlg.open){ closePanelMobile(); }
  if (ev.key === 'Tab' && panelOpenMobile && !mqDesktop.matches && !$docDlg.open && !$cDlg.open){
    var f = $panel.querySelectorAll('button:not([disabled]), [tabindex="0"]');
    if (!f.length) return;
    var first = f[0], last = f[f.length-1];
    if (ev.shiftKey && document.activeElement === first){ last.focus(); ev.preventDefault(); }
    else if (!ev.shiftKey && document.activeElement === last){ first.focus(); ev.preventDefault(); }
  }
});
if (mqDesktop.addEventListener) mqDesktop.addEventListener('change', function(){ panelOpenMobile = false; syncPanelVisibility(); });

/* =========================================================
   COPIAR
   ========================================================= */
function copyReport(){
  var txt = FB.informeTexto(state);
  var st = document.getElementById('copyStatus');
  function fallback(){
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(e){ ok = false; }
    if (ok){ st.textContent = 'Informe copiado.'; }
    else {
      var fb = document.getElementById('copyFallback'); fb.hidden = false;
      var area = document.getElementById('copyArea'); area.value = txt; area.focus(); area.select();
      st.textContent = 'No se pudo copiar automáticamente: selecciona el texto y cópialo.';
    }
  }
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ st.textContent = 'Informe copiado.'; }, fallback);
  } else fallback();
}

/* =========================================================
   ARRANQUE
   ========================================================= */
window.addEventListener('beforeunload', function(){ if (state.etapaActual >= 0) saveNow(); });
E.qa = { state:function(){ return state; }, storageOK:function(){ return storageOK; } };
render();
})();
