<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Laboratorio 02 · Salva la campaña</title>
<style>
:root{
  --paper:#f4f2ed; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1a1e23; --ink-2:#3a424c; --muted:#5d6672;
  --line:#dad6cc; --line-2:#e8e5de; --accent:#1e3a5c; --accent-2:#2c5282; --accent-soft:#e8eef5;
  --signal:#7a4d00; --signal-soft:#fbf2df; --ok:#24553a; --ok-soft:#e6f1ea; --danger:#8a1f1f; --danger-soft:#f8e9e7;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,24,30,.05),0 4px 16px rgba(20,24,30,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25;color:var(--ink);margin:0 0 .5em}
h1{font-size:clamp(1.7rem,3.2vw,2.35rem);letter-spacing:-.01em}
h2{font-size:clamp(1.3rem,2.2vw,1.6rem)}
h3{font-size:1.15rem}
h4{font-size:1rem}
p{margin:0 0 .9em}
a{color:var(--accent-2)}
small,.small{font-size:.875rem}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.85em;letter-spacing:.02em}
.eyebrow{font-family:var(--sans);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .5rem}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}

/* ---------- Encabezado ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(244,242,237,.96);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px 10px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-family:var(--sans);font-size:.78rem;letter-spacing:.16em;font-weight:700}
.brand span{font-family:var(--serif);font-size:.95rem;color:var(--ink-2)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.phase-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px}
.phase-now{font-size:.9rem;font-weight:600}
.clock{font-family:var(--mono);font-size:.85rem;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.hitos{display:flex;gap:4px;margin-left:auto;list-style:none;padding:0;margin-top:0;margin-bottom:0}
.hitos li{font-size:.72rem;letter-spacing:.08em;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.hitos li.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hitos li.done{color:var(--ink-2);background:var(--line-2)}
.progress{height:3px;background:var(--line-2);border-radius:2px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.budget{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:.85rem}
.budget div{display:flex;flex-direction:column;line-height:1.25}
.budget dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.budget dd{margin:0;font-family:var(--mono);font-weight:600;font-size:.95rem}
.budget .msg{flex-basis:100%;color:var(--ink-2);font-size:.82rem}
.budget.over{border-color:var(--danger);background:var(--danger-soft)}

/* ---------- Pasos ---------- */
.stepper{max-width:1120px;margin:14px auto 0;padding:0 20px}
.stepper ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.stepper button{font:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.stepper button[aria-current="step"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.stepper button.done{color:var(--ink-2)}
.stepper button.done::before{content:"✓ ";}
.stepper button:disabled{cursor:not-allowed;opacity:.55}

/* ---------- Contenido ---------- */
main{max-width:1120px;margin:0 auto;padding:22px 20px 80px}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:62ch}
.section{margin:34px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stack > * + *{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem;color:var(--ink-2)}
.note.signal{border-left-color:var(--signal);background:var(--signal-soft)}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.note.err{border-left-color:var(--danger);background:var(--danger-soft);color:var(--ink)}
.readonly-banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);font-size:.9rem;color:var(--ink-2);margin-bottom:18px}
.tag{display:inline-block;font-size:.76rem;letter-spacing:.01em;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);vertical-align:middle}
.tag.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag.signal{border-color:#d9b46a;color:var(--signal);background:var(--signal-soft)}
.tag.ok{border-color:#9cc3a8;color:var(--ok);background:var(--ok-soft)}
.tag.danger{border-color:#d9a19c;color:var(--danger);background:var(--danger-soft)}
.code{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em}

/* ---------- Botones y formularios ---------- */
.btn{font:inherit;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.secondary{background:var(--surface);color:var(--accent)}
.btn.secondary:hover{background:var(--accent-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{font-size:.85rem;padding:6px 12px;min-height:36px}
.btn.danger{background:var(--surface);color:var(--danger);border-color:#c98b85}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.chip{background:var(--surface);color:var(--ink-2);border-color:var(--line);font-weight:500}
label{font-weight:600;font-size:.92rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field .hint{font-size:.82rem;color:var(--muted);font-weight:400}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1px solid #bdb7aa;border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:disabled,textarea:disabled,select:disabled{background:var(--surface-2);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:0 0 12px;min-width:0}
legend{font-weight:600;font-size:.88rem;margin-bottom:6px;padding:0}
.seg{display:inline-flex;border:1px solid #bdb7aa;border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;padding:8px 12px;font-weight:500;font-size:.9rem;cursor:pointer;border-right:1px solid var(--line);background:#fff;min-height:40px}
.seg label:last-child{border-right:0}
.seg input{accent-color:var(--accent)}
.seg label.dis{cursor:not-allowed;color:var(--muted);background:var(--surface-2)}
.counter{font-size:.82rem;color:var(--muted);font-family:var(--mono)}
.counter.bad{color:var(--danger)}
.counter.good{color:var(--ok)}
.errors{margin:14px 0 0;padding:12px 16px 12px 34px;border-radius:8px;background:var(--danger-soft);border:1px solid #e3b9b4;font-size:.92rem}
.errors li{margin:2px 0}
.live{min-height:1.4em;font-size:.9rem;color:var(--ink-2)}

/* ---------- Documentos ---------- */
.doc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.doc-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--ink);min-height:42px}
.doc-btn:hover{border-color:var(--accent-2)}
.doc-btn.principal{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.doc-btn .st{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.doc-btn .st.read{color:var(--ok)}
.docq{margin:0;padding:16px 18px;background:var(--surface-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:.97rem}
.docq p:last-child{margin-bottom:0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-2);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line-2)}
thead th{background:var(--surface-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
.legend{font-size:.78rem;color:var(--muted);margin-top:12px;font-style:italic}
.docmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

/* ---------- Tarjetas de riesgo / carpetas ---------- */
.folder{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;min-height:120px;box-shadow:var(--shadow);position:relative}
.folder:hover{border-color:var(--accent-2)}
.folder[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:15px 17px}
.folder .fh{display:flex;align-items:center;gap:8px}
.folder .check{margin-left:auto;font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.folder strong{font-family:var(--serif);font-size:1.08rem}
.folder span.d{font-size:.88rem;color:var(--ink-2)}
.folder:disabled{cursor:default}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.risk + .risk{margin-top:16px}
.risk-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.risk-h h3{margin:0;font-size:1.12rem}
.risk-b{padding:18px 20px}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px;margin:0 0 16px}
.ficha div{margin:0}
.ficha dt{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.ficha dd{margin:0;font-size:.93rem}
.pregunta{font-family:var(--serif);font-size:1.02rem;border-left:3px solid var(--signal);padding:6px 12px;background:var(--signal-soft);border-radius:0 8px 8px 0;margin-bottom:14px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.measure{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.measure + .measure{margin-top:6px}
.measure input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.measure .mt{flex:1;font-size:.92rem}
.measure .mp{font-family:var(--mono);font-weight:600;white-space:nowrap;font-size:.92rem}
.measure.sel{border-color:var(--accent);background:var(--accent-soft)}
.measure.dis{opacity:.6;cursor:not-allowed}
.measure .sub{display:block;font-size:.78rem;color:var(--muted);margin-top:2px;font-weight:500}

/* ---------- Novedades ---------- */
.nov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.nov + .nov{margin-top:16px}
.nov-h{padding:12px 20px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nov-b{padding:16px 20px}
.msgbox{font-size:.98rem;padding:12px 16px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:14px}
.msgbox b{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.resp{display:flex;flex-direction:column;gap:8px}
.resp .btn{justify-content:space-between;text-align:left;width:100%;font-weight:500}
.resp .btn .cost{font-family:var(--mono);font-weight:600;white-space:nowrap}
.answered{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--ok-soft);border:1px solid #b9d5c2;font-size:.93rem}

/* ---------- Ajuste ---------- */
.adj-row{display:grid;grid-template-columns:120px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:.92rem}
.adj-row:last-child{border-bottom:0}
@media (max-width:760px){.adj-row{grid-template-columns:1fr;gap:6px}}

/* ---------- Perfil ---------- */
.axis{margin:16px 0}
.axis-l{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;font-weight:600}
.axis-l span{max-width:46%}
.axis-l small{display:block;font-weight:400;color:var(--muted)}
.axis-track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 4px}
.axis-track i{height:14px;border-radius:3px;background:var(--line-2);border:1px solid var(--line)}
.axis-track i.on{background:var(--accent);border-color:var(--accent)}
.axis-t{font-size:.88rem;color:var(--ink-2)}

/* ---------- Informe ---------- */
.report{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 30px}
.report h2{font-size:1.35rem;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.report h3{font-size:1.02rem;margin:22px 0 8px;font-family:var(--sans);letter-spacing:.04em;text-transform:uppercase}
.report table{font-size:.82rem}
.report .rec{white-space:pre-wrap;border:1px solid var(--line);padding:12px 14px;border-radius:6px;background:var(--surface-2)}
.boxes{font-family:var(--mono);letter-spacing:2px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.toc a{font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--ink-2)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.modal-h h2{margin:0;font-size:1.25rem}
.modal-b{padding:18px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 12px 12px}
.close-x{margin-left:auto;font:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.drawer-list{list-style:none;padding:0;margin:0}
.drawer-list h4{margin:16px 0 6px;font-family:var(--sans);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.cover{max-width:760px}
.cover .kicker{font-size:.78rem;letter-spacing:.2em;font-weight:700;color:var(--muted)}
.cover h1{font-size:clamp(2.2rem,5vw,3.4rem);margin:.2em 0 .1em}
.cover .sub{font-family:var(--serif);font-size:1.25rem;color:var(--ink-2);margin-bottom:1.2em}
.footer-nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}

@media (max-width:640px){
  .top-in{padding:8px 14px}
  main{padding:16px 14px 70px}
  .stepper{padding:0 14px}
  .hitos{margin-left:0}
  .card,.risk-b{padding:16px}
  .risk-h{padding:12px 16px}
  .report{padding:18px 16px}
  .modal-b,.modal-h,.modal-f{padding-left:16px;padding-right:16px}
}

/* ---------- Impresión ---------- */
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#000;font-size:11pt}
  .top,.stepper,.noprint,.btn,button,.toast,.modal-bg,.skip,.toc{display:none!important}
  main{max-width:none;padding:0}
  body.print-report main > *:not(#informe){display:none!important}
  .report{border:0;padding:0}
  .card,.risk,.nov,.report{box-shadow:none}
  a{color:#000;text-decoration:none}
  table{font-size:9pt}
  tr,td,th{page-break-inside:avoid;break-inside:avoid}
  thead th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#000}
  .rec-block{page-break-before:always;break-before:page}
  .report h3{page-break-after:avoid;break-after:avoid}
  .tag{border-color:#000;color:#000;background:#fff}
}
</style>
</head>
<body>
<a href="#main" class="skip">Saltar al contenido</a>
<header class="top" id="top"></header>
<nav class="stepper noprint" id="stepper" aria-label="Fases del expediente"></nav>
<main id="main" tabindex="-1"></main>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* =========================================================
   DATOS DEL CASO · Fuente: ARQUITECTURA FINAL CONSOLIDADA
   ========================================================= */
var STORAGE_KEY = 'labpi_salva_campana_v1';
var FONDO = 100000;
var DESCUENTO_EDICION = 6000;
var EXP_MAX = 36;
var LEG_DOC = 'Documento simulado para fines de entrenamiento.';
var LEG_BUSQ = 'Resultado simulado. No proviene de bases de datos reales ni del IMPI.';

var FASES = [
  { n: 0, titulo: 'War room', reloj: 'Viernes 09:00 · 72 H', hito: '72 H' },
  { n: 1, titulo: 'Revisa el material', reloj: 'Viernes 10:00 · 71 H', hito: '72 H' },
  { n: 2, titulo: 'Hallazgos', reloj: 'Viernes 16:00 · 65 H', hito: '72 H' },
  { n: 3, titulo: 'Triage', reloj: 'Sábado 09:00 · 48 H', hito: '48 H' },
  { n: 4, titulo: 'Presupuesto y lanzamiento', reloj: 'Sábado 15:00 · 42 H', hito: '48 H' },
  { n: 5, titulo: 'Novedades y cierre', reloj: 'Domingo 09:00 · 24 H', hito: '24 H' },
  { n: 6, titulo: 'Lanzamiento', reloj: 'Lunes 09:00 · LANZAMIENTO', hito: 'LANZAMIENTO' }
];
var HITOS = ['72 H', '48 H', '24 H', 'LANZAMIENTO'];

var RIESGOS_ORDEN = ['R1', 'R2', 'R3', 'R4', 'R5', 'R6', 'R7', 'R8'];

/* Peso y nivel de diseño: internos, nunca se muestran */
var RIESGOS = {
  R1: { carpeta: 'PR1', titulo: 'Música · «Kilómetro Cero»', corto: 'Música', peso: 3, aceptar: 'M1F',

function precioFase4(code, fin) {

/* Devuelve { pagado: {Rn: monto}, descuento: total, descontadas: {Rn:true}, total } */
function calcularPresupuesto(fin) {
  var pagado = {}, descontadas = {}, descuento = 0, total = 0, edicionesVistas = 0;
  RIESGOS_ORDEN.forEach(function (r) {
    var c = fin[r]; if (!c) return;
    var p = precioFase4(c, fin);
    if (MEDIDAS[c].edicion) {
      edicionesVistas++;
      if (edicionesVistas > 1) { p = Math.max(0, p - DESCUENTO_EDICION); descuento += DESCUENTO_EDICION; descontadas[r] = true; }
    }
    pagado[r] = p; total += p;
  });
  return { pagado: pagado, descuento: descuento, descontadas: descontadas, total: total };
}
function expMedidaFase4(code, fin) {
  if (code === 'M6D' && fin.R1 === 'M1E') return 2;

/* ---------- Ranuras ---------- */

  if (fin.R3 === 'M3D') return 'C3a';
  if (fin.R3 === 'M3B' || fin.R3 === 'M3E') return 'C3b';
  return 'C4';
}

/* ---------- Confirmar Fase 4 ---------- */
function confirmarFase4(S) {
  var fin = S.financiamiento;
  var pres = calcularPresupuesto(fin);
  S.comprometido = pres.total; S.descuento = pres.descuento; S.pagado = pres.pagado;
  S.reserva = FONDO - pres.total; S.saldo = S.reserva;
  S.cambios = [];
  RIESGOS_ORDEN.forEach(function (r) {
    var de = S.triage[r] && S.triage[r].accion, a = fin[r];
    if (de && de !== a) S.cambios.push({ r: r, de: de, a: a, masBarata: precioFase4(a, fin) < precioFase4(de, fin) });
    S.estrategia[r] = { code: a, origen: 'base', hist: [] };
    S.bloqueo[r] = { b: false, motivo: '', por: '' };
  });
  var A = ranuraA(fin), B = ranuraB(fin), C = ranuraC(fin);
  S.ranuraC = C;
  S.nov = {
    A: { id: A, resp: null },
    B: { id: B, resp: null, informativa: (B === 'B2' && fin.R1 === 'M1E') },
    C: { id: C, resp: null }
  };
  if (S.nov.B.informativa) S.nov.B.resp = 'INFO';
  ['A', 'B', 'C'].forEach(function (k) {
    var n = NOVEDADES[S.nov[k].id];
    if (n.ejecucion) bloquear(S, n.riesgo, ejecucionMotivo(S.nov[k].id), S.nov[k].id);
  });
  S.lanzInicial = JSON.parse(JSON.stringify(S.lanz));
  S.fase = 5; S.vista = 5;
  evaluarNotaProd(S);
}

function bloquear(S, r, motivo, por) {
  if (!r) return;

function marcar(S, m) {
  if (S.marcas.activas.indexOf(m) < 0) S.marcas.activas.push(m);

function slotRespondido(S, k) { return !!(S.nov[k] && S.nov[k].resp); }

  if (!S.nov.A) return false;

    if (rc === r) return true;

function responder(S, k, respId) {
  var n = S.nov[k];
  if (!n) return { ok: false, msg: 'No hay novedad en esa ranura.' };
  if (n.resp) return { ok: false, msg: 'Esta novedad ya tiene una respuesta confirmada.' };
  if (opcionesSlot(S, k).indexOf(respId) < 0) return { ok: false, msg: 'Respuesta no disponible.' };
  var R = RESP_INDEX[respId];
  if (R.costo > S.saldo) return { ok: false, msg: 'Reserva insuficiente.' };
  if (R.costo > 0) { S.saldo -= R.costo; S.pagos.push({ code: respId, monto: R.costo, txt: R.txt }); }
  var r = R.riesgo || NOVEDADES[n.id].riesgo;
  if (n.id === 'C4') {
    if (respId === 'C4-L4') S.c4MantuvoL4 = true;
    if (respId === 'C4-L2') cambiarLanzamiento(S, 'L2');
    if (respId === 'C4-L3') cambiarLanzamiento(S, 'L3');
    if (respId === 'C4-Z') { r = 'R7'; aplicarCambio(S, r, R); }
  } else if (R.cambia) {
    aplicarCambio(S, r, R);

function aplicarCambio(S, r, R) {
  var e = S.estrategia[r];

    S.hundidos.push({ r: r, code: e.code, monto: S.pagado[r], por: R.id });

function responderNotaProd(S, respId) {

function validarF3() {

    case 'f2-confirm':
      var falt = RIESGOS_ORDEN.filter(function (x) { return !S.lectura[x]; });
      if (falt.length) { UI.errors.f2 = ['Califica la solidez de la evidencia de los ocho riesgos. Faltan: ' + falt.join(', ') + '.']; render(true); var ee = $('err-f2'); if (ee) ee.scrollIntoView({ block: 'center' }); break; }
      UI.errors.f2 = [];
      var sinAbrir = [];
      RIESGOS_ORDEN.forEach(function (x) { var R = RIESGOS[x]; R.complementarios.forEach(function (d) { if (!S.docsAbiertos[d]) sinAbrir.push(d); }); if (riesgosRevisados(S).indexOf(x) >= 0 && !S.docsAbiertos[R.senal]) sinAbrir.push(R.senal); });
      var avanzar = function () { S.fase = 3; go(3); };
      if (sinAbrir.length) showModal({ title: 'Hay documentos que no has consultado', body: '<p>Quedan ' + sinAbrir.length + ' documentos opcionales sin abrir. No son obligatorios para avanzar.</p>', buttons: [{ label: 'Revisarlos', cls: 'secondary' }, { label: 'Continuar de todos modos', act: avanzar }] });
      else confirmar('Cerrar hallazgos', '<p>Tus calificaciones de evidencia quedarán registradas.</p>', 'Continuar a Triage', avanzar);
      break;
    case 'f3-confirm':
      var e3 = validarF3(); UI.errors.f3 = e3;
      if (e3.length) { render(true); var el3 = $('err-f3'); if (el3) el3.scrollIntoView({ block: 'center' }); break; }
      confirmar('Confirmar triage', '<p>Tu triage quedará fijo. En la siguiente fase verás los costos y podrás cambiar la medida de cada riesgo.</p>', 'Confirmar triage', function () {
        S.fase = 4; S.financiamiento = {}; RIESGOS_ORDEN.forEach(function (x) { S.financiamiento[x] = S.triage[x].accion; }); go(4);
      }); break;
    case 'f4-confirm':
      var e4 = validarF4(); UI.errors.f4 = e4;
      if (e4.length) { render(true); var el4 = $('err-f4'); if (el4) el4.scrollIntoView({ block: 'center' }); break; }
      var pr = calcularPresupuesto(S.financiamiento);
      confirmar('Confirmar presupuesto y lanzamiento', '<p>Vas a recomendar: <strong>' + S.lanz.code + ' · ' + LANZ[S.lanz.code].titulo + '</strong>. Mariana lo presentará así al director general. Podrás cambiarlo el domingo, después de las novedades.</p><p>Comprometido: <strong>' + fmt(pr.total) + '</strong> · Reserva para el domingo: <strong>' + fmt(FONDO - pr.total) + '</strong>. Las medidas quedan contratadas.</p>', 'Confirmar', function () {
        confirmarFase4(S); save(); go(5);
      }); break;
    case 'responder':
      var k = el.getAttribute('data-k'), id = el.getAttribute('data-id'), R = RESP_INDEX[id];
      if (R.costo > S.saldo) { toast('Reserva insuficiente para esta respuesta.'); break; }
      confirmar('Confirmar respuesta', '<p><strong>' + esc(R.txt) + '</strong>' + (R.costo ? ' · ' + fmt(R.costo) : '') + '</p><p>La respuesta se confirma y no se puede reabrir.</p>', 'Confirmar respuesta', function () {
        var out = responder(S, k, id); if (!out.ok) toast(out.msg); save(); render(true);
        var nx = $('nov-' + k); if (nx) nx.scrollIntoView({ block: 'nearest' });
      }); break;
    case 'responderNP':
      var idn = el.getAttribute('data-id'), RN = RESP_INDEX[idn];
      if (RN.costo > S.saldo) { toast('Reserva insuficiente para esta respuesta.'); break; }
      confirmar('Confirmar respuesta', '<p><strong>' + esc(RN.txt) + '</strong>' + (RN.costo ? ' · ' + fmt(RN.costo) : '') + '</p><p>La respuesta se confirma y no se puede reabrir.</p>', 'Confirmar respuesta', function () {
        var out = responderNotaProd(S, idn); if (!out.ok) toast(out.msg); save(); render(true);
      }); break;
    case 'ajustar':
      var t = intentarAjuste(S, r);
      if (!t.ok) { UI.adjMsg = t.msg; UI.adjR = null; save(); render(true); toast(t.msg); break; }
      UI.adjMsg = ''; UI.adjR = r; UI.adjMod = null; UI.adjNueva = null; render(true); break;
    case 'adj-cancel': UI.adjR = null; render(true); break;
    case 'adj-confirm':
      if (!UI.adjMod) { UI.adjMsg = 'Elige la modalidad del ajuste.'; render(true); break; }
      if (UI.adjMod === 'sustituir' && !UI.adjNueva) { UI.adjMsg = 'Elige la nueva medida.'; render(true); break; }
      var txt = UI.adjMod === 'cancelar'
        ? '<p>Cancelas «' + esc(nombreEstrategia(S.estrategia[r].code)) + '» y recuperas <strong>' + fmt(reembolsoCancelacion(S, r)) + '</strong>. La estrategia pasa a «' + esc(MEDIDAS[RIESGOS[r].aceptar].txt) + '».</p>'
        : '<p>Sustituyes «' + esc(nombreEstrategia(S.estrategia[r].code)) + '» por «' + esc(MEDIDAS[UI.adjNueva].txt) + '» por <strong>' + fmt(MEDIDAS[UI.adjNueva].recargo) + '</strong>.</p>';
      confirmar('Confirmar ajuste único', txt + '<p>Sólo tienes un ajuste. No se puede deshacer.</p>', 'Confirmar ajuste', function () {
        var out = UI.adjMod === 'cancelar' ? cancelarMedida(S, r) : sustituirEstrategia(S, r, UI.adjNueva);
        UI.adjMsg = out.ok ? 'Ajuste registrado.' : out.msg; UI.adjR = null; save(); render(true);
      }); break;
    case 'f5-confirm':
      var e5 = validarF5(); UI.errors.f5 = e5;
      if (e5.length) { render(true); var el5 = $('err-f5'); if (el5) el5.scrollIntoView({ block: 'center' }); break; }
      confirmar('Cerrar el expediente', '<p>Tus respuestas, tu ajuste, tu decisión de lanzamiento (<strong>' + S.lanz.code + ' · ' + LANZ[S.lanz.code].titulo + '</strong>) y tu recomendación quedarán fijos. Después verás los escenarios, tu perfil y el informe.</p>', 'Cerrar expediente', function () {
        S.cerrado = true; S.lanzFinal = JSON.parse(JSON.stringify(S.lanz)); S.fechaCierre = hoyISO(); S.fase = 6; go(6);
      }); break;
    case 'imprimir': document.body.classList.add('print-report'); window.print(); break;
    case 'copiar': copiarInforme(); break;
  }
}
function copiarInforme() {
  var text = construirInforme(calcular(S)).text;
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) toast('Informe copiado al portapapeles.');
    else showModal({ title: 'Copiar informe', body: '<p>Selecciona el texto y cópialo manualmente.</p><textarea id="copy-area" style="min-height:300px" readonly>' + esc(text) + '</textarea>' });
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Informe copiado al portapapeles.'); }, fallback);
  else fallback();
}
function updateCounter(id, w, min, max, sufijo) {
  var c = $('cnt-' + id); if (!c) return;
  c.textContent = w + ' palabras · ' + sufijo;
  c.className = 'counter ' + (w >= min && w <= max ? 'good' : 'bad');
}
function onChange(t) {
  var b = t.getAttribute('data-bind'); if (!b) return;
  var r = t.getAttribute('data-r');
  if (b === 'lectura') { if (soloLectura(2) || !S.docsAbiertos[RIESGOS[r].principal]) { render(true); return; } S.lectura[r] = t.value; save(); render(true); return; }
  if (soloLectura(S.vista) && ['adjmod', 'adjnueva'].indexOf(b) < 0) { render(true); return; }
  var esTriage = ['pri', 'rango', 'trat', 'accion'].indexOf(b) >= 0;
  if (esTriage && S.vista !== 3) return;
  var tr = esTriage ? (S.triage[r] = S.triage[r] || {}) : null;
  switch (b) {
    case 'pri': tr.prioridad = t.value; if (t.value !== 'P1') tr.rango = ''; break;
    case 'rango': tr.rango = t.value; break;
    case 'trat': tr.trat = t.value; if (tr.accion && MEDIDAS[tr.accion].trat !== t.value) tr.accion = ''; var ms = medidasDeTrat(r, t.value); if (ms.length === 1) tr.accion = ms[0]; break;
    case 'accion': tr.accion = t.value; break;
    case 'fin': if (soloLectura(4)) return; S.financiamiento[r] = t.value; filtrarLanz(); break;
    case 'lanz':
      if (soloLectura(S.vista)) return;
      cambiarLanzamiento(S, t.value); break;
    case 'cond':
      if (soloLectura(S.vista)) return;
      if (t.checked) { if (S.lanz.cond.length < 3 && S.lanz.cond.indexOf(r) < 0) S.lanz.cond.push(r); }
      else S.lanz.cond = S.lanz.cond.filter(function (x) { return x !== r; });
      break;
    case 'ret':
      if (soloLectura(S.vista)) return;
      if (t.checked) { if (S.lanz.ret.indexOf(r) < 0) S.lanz.ret.push(r); } else S.lanz.ret = S.lanz.ret.filter(function (x) { return x !== r; });
      break;
    case 'adjmod': UI.adjMod = t.value; UI.adjMsg = ''; render(true); return;
    case 'adjnueva': UI.adjNueva = t.value; render(true); return;
    default: return;
  }
  save(); render(true);
}
function filtrarLanz() {
  if (S.lanz.code === 'L2') S.lanz.cond = S.lanz.cond.filter(function (r) { return elegiblesCondicion(S).indexOf(r) >= 0; });
  if (S.lanz.code === 'L3') S.lanz.ret = S.lanz.ret.filter(function (r) { return elegiblesRetencion(S).indexOf(r) >= 0; });
}
function onInput(t) {
  var b = t.getAttribute('data-bind'); if (!b) return;
  var r = t.getAttribute('data-r');
  if (b === 'justP1' && !soloLectura(3)) { S.justP1 = t.value; updateCounter('justP1', contarPalabras(t.value), 40, 150, 'requerido: 40–150'); save(); }
  else if (b === 'justCosto' && !soloLectura(4)) { S.justCosto = t.value; updateCounter('justCosto', contarPalabras(t.value), 30, 100, 'requerido: 30–100'); save(); }
  else if (b === 'recomendacion' && !soloLectura(5)) { S.recomendacion = t.value; updateCounter('recomendacion', contarPalabras(t.value), 1, 200, 'máximo 200'); save(); }
  else if (b === 'nota' && !soloLectura(3)) {
    S.triage[r] = S.triage[r] || {}; S.triage[r].nota = t.value.slice(0, 100);
    var c = $('cnt-nota-' + r); if (c) c.textContent = S.triage[r].nota.length + ' / 100'; save();
  }
}
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t || t.closest('.modal-bg')) { if (t && t.closest('.modal-bg') && t.getAttribute('data-act') === 'doc') { var mb = t.closest('.modal-bg'); var top = modalStack[modalStack.length - 1]; if (top) top.close(false); abrirDoc(t.getAttribute('data-id')); } return; }
  e.preventDefault();
  act(t.getAttribute('data-act'), t);
});
document.addEventListener('change', function (e) { if (e.target.closest('#main')) onChange(e.target); });
document.addEventListener('input', function (e) { if (e.target.closest('#main')) onInput(e.target); });
document.addEventListener('submit', function (e) {
  var f = e.target; if (f.getAttribute('data-form') !== 'inicio') return;
  e.preventDefault();
  var n = $('in-nombre').value.trim();
  if (!n) { UI.errors.inicio = ['Escribe el nombre del participante para abrir el expediente.']; var keep = $('in-id').value; render(); $('in-id').value = keep; $('in-nombre').focus(); return; }
  S = estadoInicial(); S.started = true; S.nombre = n; S.id = $('in-id').value.trim(); S.fecha = hoyISO(); S.fase = 0; S.vista = 0;
  UI.errors = {}; UI.resume = false; go(0);
});
window.addEventListener('afterprint', function () { document.body.classList.toggle('print-report', S.started && !UI.resume && S.vista === 6); });

/* Interfaz de prueba (sin efectos fuera del navegador) */
window.LAB = { estadoInicial: estadoInicial, calcularPresupuesto: calcularPresupuesto, confirmarFase4: confirmarFase4, responder: responder, responderNotaProd: responderNotaProd,
  cancelarMedida: cancelarMedida, sustituirEstrategia: sustituirEstrategia, intentarAjuste: intentarAjuste, estadoAjuste: estadoAjuste, calcular: calcular,
  cambiarLanzamiento: cambiarLanzamiento, opcionesSlot: opcionesSlot, construirInforme: construirInforme, getState: function () { return S; } };

render();

</script>
